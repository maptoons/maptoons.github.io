<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Points from GeoJSON</title>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-draw/1.5.0/mapbox-gl-draw.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-draw/1.5.0/mapbox-gl-draw.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        button { position: absolute; top: 10px; left: 10px; z-index: 1000; padding: 10px; background: white; border: 1px solid #ccc; cursor: pointer; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <button onclick="document.getElementById('file-input').click()">Upload GeoJSON</button>
    <button onclick="downloadGeoJSON()" style="left: 150px;">Download GeoJSON</button>
    <input type="file" id="file-input" accept=".geojson,.json" />

    <script>
        const map = new maplibregl.Map({
            container: "map",
            style: "https://maptoons.github.io/maptoons.json",
            center: [-73.5251, 40.7684],
            zoom: 12,
            pixelRatio: 1,
            hash: true
        });

        map.on('load', () => {
            map.addSource('location', {
                'type': 'geojson',
                'data': 'https://maptoons.github.io/data/hicksville.geojson',
                'cluster': false
            });

            map.addLayer({
                id: 'location',
                type: 'circle', // Use a simple layer type
                source: 'location',
                paint: {
                    'circle-radius': 3, // Make the layer invisible
                    'circle-opacity': 1 // Make the layer invisible
                }
            });
        });

        const draw = new MapboxDraw({
            displayControlsDefault: true
        });

        map.addControl(draw);

        // Load GeoJSON and add to the map
        async function loadGeoJSON(url) {
            const response = await fetch(url);
            const geojson = await response.json();
            draw.set(geojson);  // Add the GeoJSON features to the draw control
        }

        // Handle file upload
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const geojson = JSON.parse(e.target.result);
                        draw.set(geojson);
                    } catch (error) {
                        alert("Error parsing GeoJSON file: " + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Download the final state of GeoJSON (after dragging)
        function downloadGeoJSON() {
            const geojson = draw.getAll();
            if (!geojson || geojson.features.length === 0) {
                alert("No points to save!");
                return;
            }
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "hicksville-corrected.geojson";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
