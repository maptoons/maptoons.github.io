<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Points with Undo</title>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-draw/1.5.0/mapbox-gl-draw.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-draw/1.5.0/mapbox-gl-draw.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .menu-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .menu-container button {
            position: relative;
            top: auto;
            left: auto;
            margin: 0;
        }

        #file-input {
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="menu-container">
        <button onclick="document.getElementById('file-input').click()">Upload GeoJSON</button>
        <button id="download-btn">Download GeoJSON</button>
        <button onclick="undo()">Undo (Ctrl+Z)</button>
        <input type="file" id="file-input" accept=".geojson,.json" />
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                glyphs: "assets/fonts/{fontstack}/{range}.pbf",
                sprite: "https://maptoons-github-io-git-release-20-c30a24-simon-conrads-projects.vercel.app/assets/sprites/sprites",
                sources: {
                    'osm': {
                        type: 'raster',
                        tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap Contributors',
                        maxzoom: 19
                    }
                },
                layers: [
                    {
                        id: 'osm',
                        type: 'raster',
                        source: 'osm',
                        paint: {
                            'raster-hue-rotate': 0,
                            'raster-contrast': 0,
                            'raster-saturation': -1,
                            'raster-brightness-min': 0.5,
                            'raster-brightness-max': 1,
                            'raster-opacity': 1
                        }
                    }
                ]
            },
            center: [-79.385015, 43.64507],
            zoom: 17,
            bearing: 0,
            pitch: 0,
            pixelRatio: 1,
            hash: true
        });

        // Function to add GeoJSON to the map as a visible layer
        function addGeoJSONLayer(geojson) {
            // Remove existing layer if it exists
            if (map.getSource('uploaded-geojson')) {
                map.removeLayer('uploaded-layer');
                map.removeSource('uploaded-geojson');
            }

            // Add the GeoJSON source
            map.addSource('uploaded-geojson', {
                type: 'geojson',
                data: geojson
            });

            // Add the reference layer
            map.addLayer({
                id: 'uploaded-layer',
                type: 'circle',
                source: 'uploaded-geojson',
                paint: {
                    'circle-radius': 7,
                    'circle-color': 'hsl(0, 0%, 0%)',
                    'circle-opacity': 0.2,
                    'circle-stroke-width': 0,
                    'circle-stroke-color': [
                        'match',
                        ['get', 'vehicle'],
                        'car', 'hsl(0, 80%, 50%)',     // Red
                        'plane', 'hsl(210, 80%, 50%)',  // Blue
                        'boat', 'hsl(180, 80%, 50%)',   // Teal
                        'hsl(0, 0%, 100%)'
                    ],
                }
            });

            // Add text labels for "mapname" property
            map.addLayer({
                id: 'mapname-labels',
                type: 'symbol',
                source: 'uploaded-geojson',
                layout: {
                    'text-field': ['get', 'mapname'],
                    "text-font": ["poppins-regular"],
                    'text-size': 8,
                    'text-offset': [0, 0.8],
                    'text-anchor': 'top',
                    'text-allow-overlap': true,
                    'text-ignore-placement': true
                },
                paint: {
                    'text-color': 'hsl(0, 0%, 50%)'
                }
            });

            // Fit the map to the bounds of the GeoJSON
            const bounds = new maplibregl.LngLatBounds();
            geojson.features.forEach(feature => {
                if (feature.geometry.type === 'Point') {
                    bounds.extend(feature.geometry.coordinates);
                } else if (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') {
                    feature.geometry.coordinates.flat().forEach(coord => bounds.extend(coord));
                } else if (feature.geometry.type === 'Polygon' || feature.geometry.type === 'MultiPolygon') {
                    feature.geometry.coordinates.flat(2).forEach(coord => bounds.extend(coord));
                }
            });

            if (bounds.isEmpty()) {
                console.log("No valid bounds could be calculated from the GeoJSON");
            } else {
                map.fitBounds(bounds, { padding: 50 });
            }
        }

        let originalFilename = 'points'; // Default fallback name
        let draw; // Will store the Draw control instance

        map.on('load', function () {
            // Initialize Draw control with vehicle-specific styling
            const draw = new MapboxDraw({
                displayControlsDefault: false,
                userProperties: true,
                styles: [
                    {
                        id: 'gl-draw-point',
                        type: 'circle',
                        filter: ['all', ['==', '$type', 'Point'], ['!=', 'meta', 'midpoint']],
                        paint: {
                            'circle-radius': 7,
                            'circle-color': 'hsl(30, 100%, 50%)',
                            'circle-stroke-color': [
                                'match',
                                ['get', 'vehicle'],
                                'car', 'hsl(0, 80%, 50%)',     // Red
                                'plane', 'hsl(210, 80%, 50%)',  // Blue
                                'boat', 'hsl(180, 80%, 50%)',   // Teal
                                'hsl(0, 0%, 100%)'
                            ],
                            'circle-stroke-width': 3,
                            'circle-opacity': 1
                        }
                    },
                    {
                        id: 'gl-draw-point-active',
                        type: 'circle',
                        filter: ['all', ['==', '$type', 'Point'], ['==', 'active', 'true']],
                        paint: {
                            'circle-radius': 7,
                            'circle-color': 'hsl(60, 100%, 50%)',
                        }
                    }
                ]
            });
            map.addControl(draw);

            // Label management
            function updateLabelLayer() {
                if (!map.getSource('dynamic-labels')) {
                    map.addSource('dynamic-labels', {
                        type: 'geojson',
                        data: { type: 'FeatureCollection', features: [] }
                    });

                    map.addLayer({
                        id: 'dynamic-point-labels',
                        type: 'symbol',
                        source: 'dynamic-labels',
                        layout: {
                            'text-field': ['get', 'mapname'],
                            "text-font": ["poppins-regular"],
                            'text-size': 8,
                            'text-offset': [0, 0.8],
                            'text-anchor': 'top',
                            'text-allow-overlap': false,
                            'text-ignore-placement': false
                        },
                        paint: {
                            'text-color': 'hsl(30, 100%, 50%)'
                        }
                    });

                    map.addLayer({
                        id: 'dynamic-vehicle-labels',
                        type: 'symbol',
                        source: 'dynamic-labels',
                        layout: {
                            'text-field': ['get', 'vehicle'],
                            "text-font": ["poppins-regular"],
                            'text-size': 16,
                            'text-offset': [0, -0.8],
                            'text-anchor': 'bottom',
                            'text-allow-overlap': false,
                            'text-ignore-placement': false
                        },
                        paint: {
                            'text-color': 'hsl(30, 100%, 50%)'
                        }
                    });
                }

                const features = draw.getAll();
                map.getSource('dynamic-labels').setData(features);
            }

            // Set up event listeners for drawing operations
            map.on('draw.create', updateLabelLayer);
            map.on('draw.update', updateLabelLayer);
            map.on('draw.delete', updateLabelLayer);

            // Undo functionality
            const historyStack = [];
            const MAX_HISTORY = 20;

            function saveState() {
                const currentState = draw.getAll();
                historyStack.push(JSON.parse(JSON.stringify(currentState)));

                if (historyStack.length > MAX_HISTORY) {
                    historyStack.shift();
                }
            }

            saveState(); // Initialize with empty state

            map.on('draw.create', saveState);
            map.on('draw.delete', saveState);
            map.on('draw.update', saveState);

            function undo() {
                if (historyStack.length > 1) {
                    historyStack.pop();
                    const previousState = historyStack[historyStack.length - 1];
                    draw.set(previousState);
                    if (map.getSource('uploaded-geojson')) {
                        map.getSource('uploaded-geojson').setData(previousState);
                    }
                    if (map.getSource('dynamic-labels')) {
                        map.getSource('dynamic-labels').setData(previousState);
                    }
                } else {
                    alert("Nothing to undo!");
                }
            }

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
            });

            // Modify your file upload handler to capture the original filename
            document.getElementById('file-input').addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    originalFilename = file.name.replace('.geojson', '').replace('.json', '');
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        try {
                            const geojson = JSON.parse(e.target.result);
                            historyStack.length = 0;
                            addGeoJSONLayer(geojson);
                            draw.set(geojson);
                            updateLabelLayer();
                            saveState();
                        } catch (error) {
                            alert("Error parsing GeoJSON file: " + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            });

            document.getElementById('download-btn').addEventListener('click', function () {
                const geojson = draw.getAll();
                if (!geojson || geojson.features.length === 0) {
                    alert("No points to save!");
                    return;
                }
                const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `${originalFilename}_corrected.geojson`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        });

    </script>
</body>

</html>
