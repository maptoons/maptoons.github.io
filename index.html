<!DOCTYPE html>
<html lang="en">

<head>
    <title>MapToons</title>
    <meta property="og:description" content="maptoons.com" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        body {
            color: hsl(0, 0%, 12%);
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }

        .maplibregl-canvas-container {
            text-rendering: optimizeLegibility;
        }

        #location-picker {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 25px;
            height: 25px;
            z-index: 999;
            font-size: 35px;
            text-align: right;
            display: block;
            width: auto;
            height: auto;
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 1));
        }

        nav {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            background-color: #333;
            position: absolute;
            right: 0;
            top: 50px;
        }

        nav.show {
            display: flex;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            line-height: 0.8;
            padding-bottom: 10px;
            margin: 10px;
        }

        #category-box {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            overflow-x: auto;
            overflow-y: visible;
            z-index: 1000;
            width: 100vw;
            height: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background-color: hsl(0, 0%, 100%);
        }

        .category-box-inner {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin: 0 auto;
            padding: 10px;
        }

        .category-feature {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            border-radius: 9999px;
            background-color: hsl(0, 0%, 97%);
            color: hsl(0, 0%, 40%);
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .activeCategory {
            background-color: hsl(0, 0%, 0%);
            color: hsl(0, 0%, 100%);
        }

        .category-feature span, i {
            font-size: 12px;
        }

        #info-box {
            display: flex;
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            overflow-x: auto;
            overflow-y: visible;
            z-index: 1000;
            height: auto;
            margin: 0 auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .info-box-inner {
            display: flex;
            gap: 10px;
            margin: 0 auto;
        }

        .info-feature {
            position: relative;
            width: 300px;
            height: 200px;
            min-width: 250px;
            background: hsl(0, 0%, 100%);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.2);
            display: flex;
            flex-direction: column;
        }

        .info-popup-content {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .info-popup-header {
            position: relative;
            height: 60px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            flex-shrink: 0;
        }

        .info-popup-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            flex-shrink: 0;
        }

        .info-popup-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: hsl(0, 0%, 100%);
            text-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.5);
            font-size: 18px;
            font-weight: 800;
            overflow: hidden;
        }

        .info-popup-text {
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
            overflow-y: auto;
        }

        .contact-info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .contact-item i {
            width: 16px;
            text-align: center;
            color: hsl(0, 0%, 40%);
        }

        .contact-item a {
            text-decoration: none;
            word-break: break-all;
        }

        .info-popup-footer {
            display: flex;
            gap: 5px;
            margin-top: auto;
            padding: 5px 5px 10px 5px;
            background-color: hsl(0, 0%, 97%);
            justify-content: center;
            flex-wrap: wrap;
        }

        .info-footer-column {
            flex: 1;
            min-width: 0;
            text-align: center;
            text-overflow: ellipsis;
        }

        .info-footer-column a {
            text-decoration: none;
        }

        .ellipsis {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75px;
        }

        .custom-marker {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            width: fit-content;
        }

        .custom-marker-img-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: hwb(0 100% 0%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid hsl(0, 0%, 100%);
            filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.3));
        }

        .custom-marker-img {
            display: block;
            max-width: 25px;
            max-height: 25px;
        }

        .custom-marker-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1;
            text-align: center;
            max-width: 100px;
            width: 100%;
            margin-top: 2px;
            text-shadow:
                -1px -1px 0 white,
                1px -1px 0 white,
                -1px 1px 0 white,
                1px 1px 0 white;
        }

        .maplibregl-popup {
            z-index: 900 !important;
            filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2));
        }

        .maplibregl-popup-content {
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .popup-container {
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            background-color: hsl(0, 0%, 100%);
        }

        .popup-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .popup-header {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100px;
            text-align: center;
        }

        .popup-header img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .popup-header .popup-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: hsl(0, 0%, 100%);
            margin: 0 auto;
            text-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.5);
        }

        .popup-text {
            padding: 10px;
        }

        .popup-footer {
            display: flex;
            gap: 5px;
            justify-content: center;
            padding: 0px 5px 10px 5px;
        }

        .popup-footer .footer-column {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .maplibregl-popup-close-button {
            font-size: 18px;
            color: #6c757d;
            padding: 5px;
            margin: 3px 3px 0 0;
        }

        .maplibregl-popup-close-button:hover {
            color: #495057;
            background-color: #f1f3f5;
        }

        a {
            color: hsl(200, 50%, 40%);
            text-decoration: none !important;
            border: none;
            outline: none;
        }

        h1 {
            font-size: 16px;
            font-weight: 500;
            line-height: 0.9;
        }

        h2 {
            font-size: 1.375rem;
            font-weight: 400;
            line-height: 1.5rem;
        }

        h3 {
            font-size: 9px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 2px;
        }

        h4 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1.4;
        }

        p {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.001rem;
            line-height: 1.5rem;
        }

        span {
            vertical-align: text-bottom;
        }

        @media (min-width: 768px) {}
    </style>
</head>

<body>
    <div class="container">
        <div id="map"></div>
        <div id="info-box"></div>
        <div id="category-box"></div>
    </div>

    <script>

        const imgSource = 'img'
        const styleFile = 'maptoons.json'
        const locationFile = 'data/hicksville.geojson'
        const artFile = 'data/hicksville-art.geojson'
        const spritesFile = 'data/sprites.geojson'

        const zoomThreshold = 14 // For clusters and markers
        let currentActiveCategory = 'all';
        let locationData;

        const map = new maplibregl.Map({
            container: "map",
            style: styleFile,
            center: [-73.52307, 40.765],
            //maxBounds: bounds,
            zoom: zoomThreshold + 0.1,
            //minZoom: 12,
            maxZoom: 18,
            bearing: 20,
            pitch: 20,
            hash: true,
            pixelRatio: 1
        });

        map.on('load', () => {

            fetch(locationFile)
                .then(res => res.json())
                .then(data => {
                    locationData = data;
                    // map.addSource('sprites', {
                    //     'type': 'vector',
                    //     tiles: ['http://localhost:8000/maptoons-tiles/{z}/{x}/{y}.pbf']
                    // });

                    // map.addLayer({
                    //     "id": "sprites",
                    //     "source": "sprites",
                    //     "source-layer": "maptoons-tiles",
                    //     "type": "symbol",
                    //     "layout": {
                    //         "icon-size": 0.4,
                    //         "symbol-placement": "point",
                    //         "icon-anchor": "bottom",
                    //         "icon-image": [
                    //             "concat",
                    //             "icon-",
                    //             ["get", "icon_number"]
                    //         ]
                    //     },
                    //     "paint": {
                    //         "icon-color": "hsl(0, 0%, 100%)",
                    //         "icon-opacity": [
                    //             "interpolate",
                    //             ["exponential", 0.5],
                    //             ["zoom"],
                    //             14, 0, 15, 1
                    //         ]
                    //     },
                    //     "minzoom": 16
                    // });

                    map.addSource('location', {
                        'type': 'geojson',
                        'data': locationData,
                        'cluster': true,
                        'clusterRadius': 20,
                        'clusterMinPoints': 3,
                        'clusterMaxZoom': zoomThreshold - 1
                    });

                    // Style for clustered circles
                    map.addLayer({
                        id: 'clusters',
                        type: 'circle',
                        source: 'location',
                        filter: ['has', 'point_count'],
                        paint: {
                            'circle-color': [
                                'step',
                                ['get', 'point_count'],
                                'hsl(270, 29%, 95%)',
                                10, 'hsl(270, 29%, 90%)',
                                25, 'hsl(270, 29%, 85%)'
                            ],
                            'circle-radius': [
                                'step',
                                ['get', 'point_count'],
                                15,
                                10, 20,
                                25, 25
                            ]
                        }
                    });

                    // Text label for cluster count
                    map.addLayer({
                        id: 'cluster-count',
                        type: 'symbol',
                        source: 'location',
                        filter: ['has', 'point_count'],
                        layout: {
                            'text-field': '{point_count_abbreviated}',
                            'text-font': ['poppins-regular'],
                            'text-size': 12
                        },
                        paint: {
                            'text-color': 'hsl(0, 0%, 0%)'
                        }
                    });

                    // Style for individual (non-clustered) points
                    map.addLayer({
                        id: 'cluster-points',
                        type: 'circle',
                        source: 'location',
                        filter: ['!', ['has', 'point_count']],
                        paint: {
                            'circle-radius': 7,
                            'circle-color': [
                                'case',
                                ['==', ['get', 'category'], 'eat_and_drink'], 'hsl(35, 100%, 40%)',
                                ['==', ['get', 'category'], 'visit_and_experience'], 'hsl(0, 79%, 45%)',
                                ['==', ['get', 'category'], 'play_and_learn'], 'hsl(296, 30%, 38%)',
                                ['==', ['get', 'category'], 'thrive_and_restore'], 'hsl(18, 55%, 33%)',
                                ['==', ['get', 'category'], 'shop_and_discover'], 'hsl(114, 35%, 31%)',
                                ['==', ['get', 'category'], 'live_and_work'], 'hsl(197, 35%, 36%)',
                                ['==', ['get', 'category'], 'gather_and_worship'], 'hsl(240, 12%, 24%)',
                                'hsl(0, 0%, 100%)' // default color if none match
                            ],
                            'circle-stroke-width': 0,
                            'circle-stroke-color': 'hsl(0, 0%, 0%)',
                            'circle-opacity': [
                                'step',
                                ['zoom'],
                                // Default state (zoom < zoomThreshold): All priorities visible
                                ['match', ['get', 'priority'], ['Q', 'T', 'D', 'S'], 1, 0],

                                // Q disappears at zoomThreshold
                                zoomThreshold, ['match', ['get', 'priority'], ['T', 'D', 'S'], 1, 0],

                                // T disappears at zoomThreshold + 1
                                zoomThreshold + 1, ['match', ['get', 'priority'], ['D', 'S'], 1, 0],

                                // D disappears at zoomThreshold + 1.5
                                zoomThreshold + 1.5, ['match', ['get', 'priority'], ['S'], 1, 0],

                                // S disappears at zoomThreshold + 2
                                zoomThreshold + 2, 0
                            ]
                        }
                    });

                    // Handle clicks on cluster layer
                    map.on('click', (e) => {
                        // Check for any features at click location
                        const features = map.queryRenderedFeatures(e.point, {
                            layers: ['clusters', 'cluster-count', 'cluster-points']
                        });

                        if (features.length > 0) {
                            // If it's a cluster
                            if (features[0].properties?.cluster_id) {
                                // Simply fly to clicked position with slight zoom-in
                                map.easeTo({
                                    center: e.lngLat,
                                    zoom: zoomThreshold,  // Zoom in one level
                                    duration: 500,
                                    essential: true
                                });
                            }
                            // If it's a regular point feature
                            else {
                                // Show the feature info
                                clickFeature(features[0]);
                            }
                            return;
                        }
                    });

                    // Handle clicks on marker layer
                    document.addEventListener('click', (e) => {
                        // 1. Detect clicks on:
                        const clickedElement = e.target.closest(
                            '.custom-marker'
                        );
                        if (!clickedElement) return;

                        // 2. Get the nearest parent with feature data
                        const featureElement = clickedElement.closest('[data-feature]');
                        if (!featureElement) return;

                        // 3. Parse and pass the feature
                        try {
                            const feature = JSON.parse(featureElement.dataset.feature);
                            clickFeature(feature);

                            // Add active class
                            // document.querySelectorAll('.custom-marker-img.active').forEach(el => {
                            //     el.classList.remove('active');
                            // });
                            // featureElement.classList.add('active');

                        } catch (error) {
                            console.error("Couldn't parse feature data:", error);
                        }
                    });

                    // Handle clicks on category filter
                    document.addEventListener('click', (e) => {
                        const categoryFeatureElement = e.target.closest('.category-feature');
                        if (!categoryFeatureElement) return;

                        const category = categoryFeatureElement.dataset.category;
                        if (!category) return;

                        // Close any open popup when clicking a category
                        if (window.featurePopup) {
                            window.featurePopup.remove();
                            window.featurePopup = null;
                        }

                        // Remove all activeCategory classes first
                        document.querySelectorAll('.category-feature.activeCategory').forEach(el => {
                            el.classList.remove('activeCategory');
                        });

                        // Toggle logic
                        if (currentActiveCategory === category) {
                            // Second click on same category - remove filter
                            filterLocation('all'); // Show all features
                            categoryFeatureElement.classList.remove('activeCategory');
                            currentActiveCategory = 'all';
                        } else {
                            // New category selected
                            filterLocation(category);
                            categoryFeatureElement.classList.add('activeCategory');
                            currentActiveCategory = category;
                        }
                    });

                });
        });

        const filterLocation = (category) => {
            if (!locationData) return;

            const filtered = {
                ...locationData,
                features: category === 'all'
                    ? locationData.features
                    : locationData.features.filter(f => f.properties.category === category)
            };

            map.getSource('location').setData(filtered);

            currentActiveCategory = category;
            updateMarkers(); // now update markers as usual
        };

        const createCategoryBox = () => {
            const categoryBox = document.getElementById('category-box');
            
            categoryBox.innerHTML = '';
            const innerContainer = document.createElement('div');
            innerContainer.className = 'category-box-inner';
            categoryBox.appendChild(innerContainer);

            const categories = [
                { id: 'eat_and_drink', icon: 'fa-utensils' },
                { id: 'visit_and_experience', icon: 'fa-landmark' },
                { id: 'play_and_learn', icon: 'fa-child' },
                { id: 'thrive_and_restore', icon: 'fa-leaf' },
                { id: 'shop_and_discover', icon: 'fa-shopping-bag' },
                { id: 'live_and_work', icon: 'fa-home' },
                { id: 'gather_and_worship', icon: 'fa-church' }
            ];

            categories.forEach(({ id, icon }) => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-feature';
                categoryElement.dataset.category = id;
                const label = id
                    .replace(/_and_/g, ' & ')
                    .replace(/\b\w/g, char => char.toUpperCase());
                
                // Create icon element separately to apply color
                const iconElement = document.createElement('i');
                iconElement.className = `fa-solid ${icon}`;
                iconElement.style.color = getCategoryColor(id); // Apply category color
                
                // Create text span
                const textSpan = document.createElement('span');
                textSpan.textContent = label;
                
                // Append elements
                categoryElement.appendChild(iconElement);
                categoryElement.appendChild(textSpan);
                
                innerContainer.appendChild(categoryElement);
            });
        };

        // objects for caching and keeping track of HTML marker objects (for performance)
        const markers = {};
        let markersOnScreen = {};

        function updateMarkers() {
            const zoom = map.getZoom();

            if (zoom <= zoomThreshold) {
                // Remove all markers if zoomed out
                for (const id in markersOnScreen) {
                    markersOnScreen[id].remove();
                }
                markersOnScreen = {};
                return;
            }

            // Determine which priorities should be displayed at this zoom level
            let priorityLevels = [];
            if (zoom >= zoomThreshold && zoom < zoomThreshold + 1) priorityLevels = ['Q'];
            if (zoom >= zoomThreshold + 1 && zoom < zoomThreshold + 1.5) priorityLevels = ['Q', 'T'];
            if (zoom >= zoomThreshold + 1.5 && zoom < zoomThreshold + 2) priorityLevels = ['Q', 'T', 'D'];
            if (zoom >= zoomThreshold + 2) priorityLevels = ['Q', 'T', 'D', 'S'];

            const newMarkers = {};
            const features = map.querySourceFeatures('location');

            for (let i = 0; i < features.length; i++) {
                const coords = features[i].geometry.coordinates;
                const props = features[i].properties;

                // Apply the category filter based on the global selectedCategory
                if (currentActiveCategory !== 'all' && props.category !== currentActiveCategory) continue;

                // Exclude clusters
                if (props.cluster || !priorityLevels.includes(props.priority)) continue;
                const id = props.id;

                let marker = markers[id];
                if (!marker) {
                    // Create container div
                    const el = document.createElement('div');
                    el.className = 'custom-marker';
                    el.dataset.id = id;
                    el.dataset.feature = JSON.stringify(features[i]);

                    // Create image container div
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'custom-marker-img-container';
                    imgContainer.style.backgroundColor = getCategoryColor(props.category);

                    // Create image element
                    const img = document.createElement('img');
                    img.src = `${imgSource}/${props.img}.png`;
                    img.className = 'custom-marker-img';

                    // Create label element
                    const label = document.createElement('p');
                    label.innerText = `${props.mapname}`;
                    label.className = 'custom-marker-label';
                    //label.style.color = getCategoryColor(props.category);

                    // Build the structure
                    imgContainer.appendChild(img);
                    el.appendChild(imgContainer);
                    el.appendChild(label);

                    marker = markers[id] = new maplibregl.Marker({
                        element: el,
                        anchor: 'center',
                        offset: [0, 15]
                    }).setLngLat(coords);
                }
                newMarkers[id] = marker;

                if (!markersOnScreen[id]) marker.addTo(map);
            }

            for (const id in markersOnScreen) {
                if (!newMarkers[id]) markersOnScreen[id].remove();
            }
            markersOnScreen = newMarkers;
        }

        const updateInfoBox = async () => {
            const features = map.querySourceFeatures('location');
            const infoBox = document.getElementById('info-box');
            let uniqueFeatures = new Map();

            // Store the current content of the infoBox
            const currentContent = infoBox.innerHTML;

            const innerContainer = document.createElement('div');
            innerContainer.className = 'info-box-inner';

            // Process each feature
            for (const feature of features) {
                if (feature.properties.cluster_id) {
                    // Handle clustered features
                    const clusterId = feature.properties.cluster_id;

                    try {
                        // Get the individual features within the cluster
                        const clusterFeatures = await map.getSource('location').getClusterLeaves(
                            clusterId,
                            Infinity,
                            0
                        );
                        clusterFeatures.forEach(clusterFeature => {
                            const featureId = clusterFeature.properties.id;
                            if (!uniqueFeatures.has(featureId)) {
                                uniqueFeatures.set(featureId, clusterFeature);
                            }
                        });
                    } catch (error) {
                        console.error('Error fetching cluster leaves:', error);
                    }
                } else {
                    const featureId = feature.properties.id;
                    if (!uniqueFeatures.has(featureId)) {
                        uniqueFeatures.set(featureId, feature);
                    }
                }
            }

            // Convert the Map values to an array
            let allFeatures = Array.from(uniqueFeatures.values());

            // Sort features alphabetically by the 'mapname' property
            allFeatures.sort((a, b) => {
                const nameA = a.properties.mapname || ''; // Changed from id to mapname for sorting
                const nameB = b.properties.mapname || '';
                return nameA.localeCompare(nameB);
            });

            allFeatures.forEach(feature => {
                const properties = feature.properties;

                // Create feature container
                const featureElement = document.createElement('div');
                featureElement.className = 'info-feature';
                featureElement.dataset.id = properties.id;
                featureElement.dataset.feature = JSON.stringify(feature);

                // Create popup-like structure
                const popupContent = document.createElement('div');
                popupContent.className = 'info-popup-content';

                // Create header section
                const popupHeader = document.createElement('div');
                popupHeader.className = 'info-popup-header';

                // Create img element
                if (properties.img) {
                    const img = document.createElement('img');
                    img.src = `${imgSource}/${properties.category}_banner.png`;
                    img.className = 'info-popup-image';
                    popupHeader.appendChild(img);
                }

                // Create title
                const title = document.createElement('h1');
                title.className = 'info-popup-title';
                title.textContent = properties.mapname;
                popupHeader.appendChild(title);

                // Add header to content
                popupContent.appendChild(popupHeader);

                // Create text content container
                const textContainer = document.createElement('div');
                textContainer.className = 'info-popup-text';

                // Add info text if exists
                if (properties.info) {
                    const infoText = document.createElement('p');
                    infoText.textContent = properties.info;
                    textContainer.appendChild(infoText);
                }

                // Create contact info container
                const contactInfo = document.createElement('div');
                contactInfo.className = 'contact-info';

                // Add Address if exists
                if (properties.address) {
                    const addressDiv = document.createElement('div');
                    addressDiv.className = 'contact-item';
                    addressDiv.innerHTML = `
                        <i class="fa-solid fa-location-dot"></i>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(properties.address)}" 
                        target="_blank">${properties.address}</a>
                    `;
                    contactInfo.appendChild(addressDiv);
                }

                // Add Phone if exists
                if (properties.phone) {
                    const phoneDiv = document.createElement('div');
                    phoneDiv.className = 'contact-item';
                    phoneDiv.innerHTML = `
                        <i class="fa-solid fa-phone"></i>
                        <a href="tel:${properties.phone}">${properties.phone}</a>
                    `;
                    contactInfo.appendChild(phoneDiv);
                }

                // Add Email if exists
                if (properties.email) {
                    const emailDiv = document.createElement('div');
                    emailDiv.className = 'contact-item';
                    emailDiv.innerHTML = `
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:${properties.email}">${properties.email}</a>
                    `;
                    contactInfo.appendChild(emailDiv);
                }

                // Add Website if exists
                if (properties.web) {
                    const webDiv = document.createElement('div');
                    webDiv.className = 'contact-item';
                    webDiv.innerHTML = `
                        <i class="fa-solid fa-globe"></i>
                        <a href="${properties.web}" target="_blank">${properties.web.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(webDiv);
                }

                // Add Facebook if exists
                if (properties.facebook) {
                    const fbDiv = document.createElement('div');
                    fbDiv.className = 'contact-item';
                    fbDiv.innerHTML = `
                        <i class="fa-brands fa-facebook"></i>
                        <a href="${properties.facebook}" target="_blank">${properties.facebook.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(fbDiv);
                }

                // Add Instagram if exists
                if (properties.instagram) {
                    const igDiv = document.createElement('div');
                    igDiv.className = 'contact-item';
                    igDiv.innerHTML = `
                        <i class="fa-brands fa-instagram"></i>
                        <a href="${properties.instagram}" target="_blank">${properties.instagram.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(igDiv);
                }

                // Only add contact info if at least one exists
                if (contactInfo.children.length > 0) {
                    textContainer.appendChild(contactInfo);
                }

                // Add the complete text container to popup content
                popupContent.appendChild(textContainer);

                // Create footer container
                const footer = document.createElement('div');
                footer.className = 'info-popup-footer';

                // Add Address if exists
                if (properties.address) {
                    const addressColumn = document.createElement('div');
                    addressColumn.className = 'info-footer-column info-footer-address';

                    const searchQuery = encodeURIComponent(`${properties.mapname} ${properties.address}`);
                    addressColumn.innerHTML = `
                        <a href="https://www.google.com/maps/search/?api=1&query=${searchQuery}" target="_blank"><i class="fa-solid fa-location-dot"></i></a>
                    `;
                    footer.appendChild(addressColumn);
                }

                // Add Phone if exists
                if (properties.phone) {
                    const phoneColumn = document.createElement('div');
                    phoneColumn.className = 'info-footer-column info-footer-phone';
                    phoneColumn.innerHTML = `
                        <a href="tel:${properties.phone}"><i class="fa-solid fa-phone"></i></a>
                    `;
                    footer.appendChild(phoneColumn);
                }

                // Add Email if exists
                if (properties.email) {
                    const emailColumn = document.createElement('div');
                    emailColumn.className = 'info-footer-column info-footer-email';
                    emailColumn.innerHTML = `
                        <a href="mailto:${properties.email}"><i class="fa-solid fa-envelope"></i></a>
                    `;
                    footer.appendChild(emailColumn);
                }

                // Add Website if exists
                if (properties.web) {
                    const webColumn = document.createElement('div');
                    webColumn.className = 'info-footer-column info-footer-web';
                    webColumn.innerHTML = `
                        <a href="${properties.web}" target="_blank"><i class="fa-solid fa-globe"></i></a>
                    `;
                    footer.appendChild(webColumn);
                }

                // Add Facebook if exists
                if (properties.facebook) {
                    const facebookColumn = document.createElement('div');
                    facebookColumn.className = 'info-footer-column info-footer-facebook';
                    facebookColumn.innerHTML = `
                        <a href="${properties.facebook}" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                    `;
                    footer.appendChild(facebookColumn);
                }

                // Add Instagram if exists
                if (properties.instagram) {
                    const instagramColumn = document.createElement('div');
                    instagramColumn.className = 'info-footer-column info-footer-instagram';
                    instagramColumn.innerHTML = `
                        <a href="${properties.instagram}" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    `;
                    footer.appendChild(instagramColumn);
                }

                // Only add footer if at least one contact method exists
                if (footer.children.length > 0) {
                    popupContent.appendChild(footer);
                }

                // Add the complete popup content to the feature element
                featureElement.appendChild(popupContent);
                innerContainer.appendChild(featureElement);
            });

            // Update DOM
            infoBox.innerHTML = '';
            infoBox.appendChild(innerContainer);
            if (innerContainer.children.length === 0 && currentContent) {
                infoBox.innerHTML = currentContent;
            }
        };

        function hideInfoBox() {
            document.getElementById('info-box').classList.remove('visible');
        }

        // Optional: Auto-close when clicking outside
        document.addEventListener('click', (e) => {
            const infoBox = document.getElementById('info-box');
            if (!infoBox.contains(e.target)) {
                hideInfoBox();
            }
        });

        // Helper function for clicks
        const clickFeature = (feature) => {
            let coordinates = feature.geometry.coordinates;

            try {
                // Update info-box
                updateInfoBox(feature);

                // Fly to location
                flyToFeature(coordinates);

                //await updateInfoBox();
                //scrollToFeatureInfo(feature.properties.id);

            } catch (error) {
                console.error('Error handling feature click:', error);
            }
        };

        // Helper function for flyTo animation
        const flyToFeature = (coordinates) => {
            return new Promise((resolve) => {

                map.easeTo({
                    center: coordinates,
                    zoom: 17,
                    //padding: { top: 300, bottom: 100, left: 20, right: 20 },
                    essential: true
                });

                map.once('moveend', resolve);
            });
        };

        const getCategoryColor = (category) => {
            const colorMap = {
                'eat_and_drink': 'hsl(35, 100%, 60%)',
                'visit_and_experience': 'hsl(0, 79%, 65%)',
                'play_and_learn': 'hsl(296, 30%, 58%)',
                'thrive_and_restore': 'hsl(18, 55%, 53%)',
                'shop_and_discover': 'hsl(114, 35%, 51%)',
                'live_and_work': 'hsl(197, 35%, 56%)',
                'gather_and_worship': 'hsl(240, 12%, 44%)',
                'default': 'hsl(0, 0%, 100%)'
            };
            return colorMap[category] || colorMap.default;
        };

        // Update markers on the screen and do so on every map move/moveend
        map.on('data', (e) => {
            if (e.sourceId !== 'location' || !e.isSourceLoaded) return;

            map.on('move', updateMarkers);
            map.on('moveend', updateMarkers);
            updateMarkers();
        });

        map.once('idle', () => {
            createCategoryBox();
        });

        map.once('data', (e) => {
            if (e.sourceId === 'location' && e.isSourceLoaded) {
                updateInfoBox();
            }
        });

        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point);
            if (features.length > 0) {
                console.log('Clicked feature:', features[0].properties);
            } else {
                console.log('No features at this location');
            }
        });

    </script>

</body>

</html>
