<!DOCTYPE html>
<html lang="en">

<head>
    <title>MapToons</title>
    <meta property="og:description" content="maptoons.com" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { color: hsl(0, 0%, 20%); height: 100vh; width: 100vw; }
        .container { position:relative; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }

        .maplibregl-ctrl-bottom-right{ display: none; }
        .maplibregl-canvas-container { text-rendering: optimizeLegibility; }

        #location-picker { position: fixed; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 999; font-size: 35px; text-align:right; display: block; width: auto; height: auto; cursor: pointer; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 1)); }
        nav {display:none; flex-direction:column; align-items:flex-start; width:100%; background-color:#333; position:absolute; right:0; top:50px;}
        nav.show {display:flex;}
        nav a {color:white; text-decoration:none; font-size:14px; line-height:0.8; padding-bottom:10px; margin:10px;}

        #category-box { display: flex; position: fixed; top: 10px; left: 0; right: 0; overflow-x: auto; overflow-y: visible; z-index: 1000; max-width: 90vw; height: auto; margin: 0 auto; scrollbar-width: none; -ms-overflow-style: none; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); border-radius: 5px; }
        .category-box-inner { display: flex; justify-content: flex-start; gap: 10px; margin: 0 auto; background-color: hsl(0, 0%, 100%); padding: 10px; border-radius: 5px; }
        .category-feature { position: relative; flex-shrink: 0; width: 40px; height: 40px; overflow: visible; cursor: pointer; }
        .category-feature .image-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center; z-index: 2; }
        .category-feature .image-container img { width: 40px; height: 40px; border-radius: 5px; }
        .category-text { position: absolute; bottom: -10%; left: 50%; transform: translate(-50%, 50%); font-size: 9px; line-height: 0.8; letter-spacing: 0px; text-align: center; width: fit-content; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; display: inline-block; z-index: 1; }

        .category-feature.active img { width: 30px; height: 30px; }

        #info-box { display: flex; position: fixed; bottom: 10px; left: 0; right: 0; overflow-x: auto; overflow-y: visible; z-index: 1000; max-width: 90vw; height: auto; margin: 0 auto; scrollbar-width: none; -ms-overflow-style: none; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); border-radius: 5px; }
        .info-box-inner { display: flex; gap: 10px; margin: 0 auto; background-color: hsl(0, 0%, 100%); padding: 10px; border-radius: 5px; }
        .info-feature { position: relative; width: auto; height: auto; overflow: visible; cursor: pointer; }
        .info-feature .info-image-container { text-align: center; line-height: 0; }
        .info-feature .info-image { width: auto; height: 30px; cursor: pointer; filter: drop-shadow(0 -1px 0 hsl(0, 0%, 0%)) drop-shadow(0 1px 0 hsl(0, 0%, 0%)) drop-shadow(-1px 0 0 hsl(0, 0%, 0%)) drop-shadow(1px 0 0 hsl(0, 0%, 0%)); border-radius: 2px; }

        .custom-marker { display: flex; justify-content: center; align-items: center; pointer-events: auto; cursor: pointer; background-color: hsl(0, 0%, 100%); width: 25px; height: 25px; border-radius: 50%; border: 2px solid hsl(0, 0%, 100%); }
        .custom-marker img { display: block; pointer-events: auto; max-width: 15px; max-height: 15px; filter: grayscale(100%) contrast(1000%) brightness(0%) invert(100%); }
        
        .maplibregl-popup { z-index: 900 !important; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); }
        .maplibregl-popup-content { padding: 0; width: 100%; height: 100%; }
        .popup-container { position: relative; overflow-y:auto; overflow-x:hidden; width: 100%; height: 100%; background-color: hsl(0, 0%, 100%); }
        .popup-content { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .popup-header { position: relative; overflow: hidden; width: 100%; height: 100px; text-align: center; }
        .popup-header img { width: 100%; height: auto; object-fit: cover; display: block; }
        .popup-header .popup-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 100%; color: hsl(0, 0%, 100%); margin: 0 auto; text-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.5); }
        .popup-text { padding: 10px; }
        .popup-footer { display: flex; gap: 5px; justify-content: center; padding: 0px 5px 10px 5px; }
        .popup-footer .footer-column { flex: 1; min-width: 0; text-align: center; }

        .maplibregl-popup-close-button { font-size: 18px; color: #6c757d; padding: 5px; margin: 3px 3px 0 0; }
        .maplibregl-popup-close-button:hover { color: #495057; background-color: #f1f3f5; }
        
        a { color: hsl(200, 50%, 40%); text-decoration: none !important; border: none; outline: none; }
        h1 { font-size: 28px; font-weight: 900; line-height: 0.9; letter-spacing: -2px; }
        h2 { font-size: 13px; font-weight: 600; line-height: 1; margin-bottom: 2px; }
        h3 { font-size: 9px; font-weight: 400; line-height: 1; margin-bottom: 2px; }
        h4 { font-size: 9px; font-weight: 400; letter-spacing: 0; line-height: 1.4; margin-top: 2px; }
        p { font-size: 14px; font-weight: 400; letter-spacing: 0; line-height: 1.4; }
        .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (min-width: 768px) {
            .ellipsis { max-width: 100px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="map"></div>
        <div id="info-box"></div>
        <div id="category-box"></div>
    </div>

    <script>
        
        //const imgSource = 'http://localhost:8000/img'
        const imgSource = 'https://maptoons.github.io/img'
        //const styleFile = 'http://localhost:8000/maptoons.json'
        const styleFile = 'https://maptoons.github.io/maptoons.json'
        //const locationFile = 'http://localhost:8000/data/hicksville.geojson'
        const locationFile = 'https://maptoons.github.io/data/hicksville.geojson'
        //const artFile = 'http://localhost:8000/data/hicksville-art.geojson'
        const artFile = 'https://maptoons.github.io/data/hicksville-art.geojson'

        const zoomThreshold = 14

        const map = new maplibregl.Map({
            container: "map",
            style: styleFile,
            center: [-73.5251, 40.7684],
            //maxBounds: bounds,
            zoom: 14,
            //minZoom: 12,
            maxZoom: 18,
            bearing: 20,
            pitch: 20,
            hash: true,
            pixelRatio: 1
        });

        map.on('load', () => {

            map.addSource('location', {
                'type': 'geojson',
                'data': locationFile,
                'cluster': false
            });

            map.addSource('location-cluster', {
                'type': 'geojson',
                'data': locationFile,
                'cluster': true,
                'clusterRadius': 20,
                'clusterMinPoints': 3,
                'clusterMaxZoom': zoomThreshold
            });

            // Style for clustered points
            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'location-cluster',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': [
                        'step',
                        ['get', 'point_count'],
                        'hsl(0, 0%, 90%)',
                        10, 'hsl(0, 0%, 95%)',
                        25, 'hsl(0, 0%, 97%)'
                    ],
                    'circle-radius': [
                        'step',
                        ['get', 'point_count'],
                        15,
                        10, 20,
                        25, 25
                    ]
                },
                'maxzoom': zoomThreshold
            });

            // Text label for cluster count
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'location-cluster',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count_abbreviated}',
                    'text-font': ['montserrat-regular'],
                    'text-size': 12
                },
                paint: {
                    'text-color': 'hsl(0, 0%, 0%)'
                },
                'maxzoom': zoomThreshold
            });

            // Style for individual (non-clustered) points
            map.addLayer({
                id: 'cluster-points',
                type: 'circle',
                source: 'location-cluster',
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-radius': 5,
                    'circle-color': [
                        'case',
                        ['==', ['get', 'category'], 'eat_and_drink'], 'hsl(35, 100%, 40%)',
                        ['==', ['get', 'category'], 'visit_and_experience'], 'hsl(0, 79%, 45%)',
                        ['==', ['get', 'category'], 'play_and_learn'], 'hsl(296, 30%, 38%)',
                        ['==', ['get', 'category'], 'thrive_and_restore'], 'hsl(18, 55%, 33%)',
                        ['==', ['get', 'category'], 'shop_and_discover'], 'hsl(114, 35%, 31%)',
                        ['==', ['get', 'category'], 'live_and_work'], 'hsl(197, 35%, 36%)',
                        ['==', ['get', 'category'], 'gather_and_worship'], 'hsl(240, 12%, 24%)',
                        'hsl(0, 0%, 100%)' // default color if none match
                    ],
                    'circle-stroke-width': 0,
                    'circle-stroke-color': 'hsl(0, 0%, 0%)'
                }
            });

            // NEED THIS STYLE TO ACCESS UNCLUSTERED DATA!
            map.addLayer({
                id: 'points',
                type: 'circle',
                source: 'location',
                paint: {
                    'circle-opacity': 0,
                    'circle-radius': 0
                }
            });

        });

        // objects for caching and keeping track of HTML marker objects (for performance)
        const markers = {};
        let markersOnScreen = {};

        function updateMarkers() {
            const zoom = map.getZoom();

            if (zoom <= zoomThreshold) {
                // Remove all markers if zoomed out
                for (const id in markersOnScreen) {
                    markersOnScreen[id].remove();
                }
                markersOnScreen = {};
                return;
            }

            // Determine which priorities should be displayed at this zoom level
            let priorityLevels = [];
            if (zoom >= 14 && zoom < 15) priorityLevels = ['Q'];
            if (zoom >= 15 && zoom < 16) priorityLevels = ['Q', 'T'];
            if (zoom >= 16 && zoom < 17) priorityLevels = ['Q', 'T', 'D'];
            if (zoom >= 17) priorityLevels = ['Q', 'T', 'D', 'S'];

            const newMarkers = {};
            const features = map.querySourceFeatures('location');

            for (let i = 0; i < features.length; i++) {
                const coords = features[i].geometry.coordinates;
                const props = features[i].properties;
                
                if (props.cluster || !priorityLevels.includes(props.priority)) continue;
                const id = props.id;

                let marker = markers[id];
                if (!marker) {
                    const el = document.createElement('div');
                    el.className = 'custom-marker';
                    el.style.backgroundColor = getCategoryColor(props.category);
                    
                    const img = document.createElement('img');
                    img.src = `${imgSource}/${props.img}.png`;
                    
                    el.appendChild(img);

                    marker = markers[id] = new maplibregl.Marker({
                        element: el
                    }).setLngLat(coords);
                }
                newMarkers[id] = marker;

                if (!markersOnScreen[id]) marker.addTo(map);
            }

            for (const id in markersOnScreen) {
                if (!newMarkers[id]) markersOnScreen[id].remove();
            }
            markersOnScreen = newMarkers;
        }

        const getCategoryColor = (category) => {
            const colorMap = {
                'eat_and_drink': 'hsl(35, 100%, 50%)',
                'visit_and_experience': 'hsl(0, 79%, 55%)',
                'play_and_learn': 'hsl(296, 30%, 48%)',
                'thrive_and_restore': 'hsl(18, 55%, 43%)',
                'shop_and_discover': 'hsl(114, 35%, 41%)',
                'live_and_work': 'hsl(197, 35%, 46%)',
                'gather_and_worship': 'hsl(240, 12%, 34%)',
                'default': 'hsl(0, 0%, 90%)'
            };
            return colorMap[category] || colorMap.default;
        };

        // Update markers on the screen and do so on every map move/moveend
        map.on('data', (e) => {
            if (e.sourceId !== 'location' || !e.isSourceLoaded) return;

            map.on('move', updateMarkers);
            map.on('moveend', updateMarkers);
            updateMarkers();
        });

        // Point zoom based on priority
        map.on('zoom', () => {
            const zoom = map.getZoom();
            map.setFilter('points', [
                '<',
                ['match', ['get', 'priority'],
                    'Q', 15,
                    'T', 16,
                    'D', 17,
                    'S', 18,
                    18
                ],
                zoom
            ]);
        });
    </script>

</body>

</html>
