<!DOCTYPE html>
<html lang="en">

<head>
    <title>MapToons</title>
    <meta property="og:description" content="maptoons.com" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        html,
        body {
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
        }

        body {
            color: hsl(0, 0%, 12%);
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }

        .maplibregl-canvas-container {
            text-rendering: optimizeLegibility;
        }

        #refresh-features-btn {
            display: none;
        }

        .category-dropdown-wrapper {
            position: relative;
            width: 150px;
        }

        .dropdown-button {
            padding: 2px 10px;
            border-radius: 9999px;
            background-color: hsl(0, 0%, 95%);
            color: hsl(0, 0%, 40%);
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .dropdown-menu {
            position: fixed;
            top: 50px;
            left: 10px;
            width: 150px;
            padding: 10px;
            border-radius: 5px;
            background: hsl(0, 0%, 100%);
            z-index: 2000;
            display: none;
        }

        .dropdown-menu.open {
            display: block;
        }

        .dropdown-option {
            padding: 5px;
            cursor: pointer;
        }

        #category-box {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            overflow-x: auto;
            overflow-y: visible;
            z-index: 1000;
            width: 100vw;
            height: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background-color: hsl(0, 0%, 100%);
        }

        .category-box-inner {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin: 0 auto;
            padding: 10px;
        }

        .category-feature {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            border-radius: 9999px;
            background-color: hsl(0, 0%, 95%);
            color: hsl(0, 0%, 40%);
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .activeCategory {
            background-color: hsl(0, 0%, 0%);
            color: hsl(0, 0%, 100%);
        }

        #info-box {
            display: flex;
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            z-index: 1000;
            height: auto;
            margin: 0 auto;
            display: none;
            overflow: visible;
        }

        #info-box.visible {
            display: block;
        }

        .info-box-inner {
            display: flex;
            overflow-y: visible;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scroll-padding: 0 calc(50vw - 150px);
            /* Center a 300px-wide item */
            gap: 10px;
            width: 100%;
            scrollbar-width: none;
            padding-top: 10px;
        }

        /* Center items with pseudo-elements */
        .info-box-inner::before,
        .info-box-inner::after {
            content: "";
            flex: 0 0 calc(50% - 150px);
            /* Half viewport minus half item width */
            scroll-snap-align: none;
        }

        .info-box-inner::-webkit-scrollbar {
            display: none;
        }

        .info-feature {
            flex: 0 0 auto;
            width: 300px;
            height: 200px;
            scroll-snap-align: center;
        }

        .info-feature.active {
            position: relative;
            transform: translate(0, -10px);
        }

        .info-popup-content {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 5px;
            background: hsl(0, 0%, 100%);
            box-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.2);
        }

        .info-popup-header {
            position: relative;
            height: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        .info-popup-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            pointer-events: none;
            filter: grayscale(100%);
            opacity: 1;
        }

        .info-popup-banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: normal;
        }

        .info-popup-image {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            z-index: 1;
        }

        .info-popup-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96%;
            color: hsl(0, 0%, 100%);
            filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.3));
            font-size: 16px;
            font-weight: 800;
            padding: 5px;
            overflow: hidden;
        }

        .info-popup-text {
            padding: 10px;
            line-height: 1.4;
            overflow-y: auto;
        }

        .truncated-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            /* Limit to 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .truncated-text.expanded {
            -webkit-line-clamp: unset;
            /* Remove line limit */
        }

        .contact-info {
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .contact-item i {
            width: 16px;
            text-align: center;
            color: hsl(0, 0%, 40%);
        }

        .contact-item a {
            text-decoration: none;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-popup-footer {
            display: flex;
            gap: 5px;
            margin-top: auto;
            padding: 5px 5px 10px 5px;
            background-color: hsl(0, 0%, 97%);
            justify-content: center;
            flex-wrap: wrap;
        }

        .info-footer-column {
            flex: 1;
            min-width: 0;
            text-align: center;
            text-overflow: ellipsis;
        }

        .info-footer-column a {
            text-decoration: none;
        }

        .ellipsis {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75px;
        }

        .custom-marker {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: fit-content;
            pointer-events: none;
        }

        .custom-marker.active .custom-marker-wrapper {
            transform: scale(1.5);
            transform-origin: bottom center;
            transition: transform 0.2s ease;
        }

        .custom-marker-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.5));
        }

        .custom-marker-img-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: hsl(0 0% 100%);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 3px solid;
            pointer-events: auto;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .custom-marker-triangle {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid;
            z-index: 1;
        }

        .custom-marker-img {
            display: block;
            max-width: 25px;
            max-height: 25px;
        }

        .custom-marker-label {
            font-size: 9px;
            font-weight: 600;
            line-height: 1;
            text-align: center;
            max-width: 100px;
            width: 100%;
            margin-top: 2px;
            color: hsl(0, 0%, 20%);
            text-shadow:
                -1px -1px 0 hsl(0 0% 100%),
                1px -1px 0 hsl(0 0% 100%),
                -1px 1px 0 hsl(0 0% 100%),
                1px 1px 0 hsl(0 0% 100%);
        }

        #map-controls {
            position: absolute;
            position: fixed;
            top: 50px;
            left: 0;
            right: 0;
            width: fit-content;
            margin: 0 auto;
            z-index: 1000;
        }

        .pill-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border: none;
            outline: none;
            border-radius: 9999px;
            background-color: hsla(0, 0%, 100%, 0.7);
            color: hsl(0, 0%, 40%);
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        a {
            color: hsl(200, 50%, 40%);
            text-decoration: none !important;
            border: none;
            outline: none;
        }

        h1 {
            font-size: 16px;
            font-weight: 500;
            line-height: 0.9;
        }

        h2 {
            font-size: 1.375rem;
            font-weight: 400;
            line-height: 1.5rem;
        }

        h3 {
            font-size: 9px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 2px;
        }

        h4 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1.4;
        }

        p {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.001rem;
            line-height: 1.5rem;
        }

        span {
            vertical-align: text-bottom;
        }

        @media (min-width: 768px) {}
    </style>
</head>

<body>
    <div class="container">
        <div id="header"></div>
        <div id="map"></div>
        <div id="info-box"></div>
        <div id="category-box"></div>
        <div id="map-controls">
            <button id="refresh-features-btn" class="pill-button">
                Show Info
            </button>
        </div>
    </div>

    <script>

        const imgSource = 'img'
        const styleFile = 'maptoons.json'
        const locationFile = 'data/hicksville.geojson'
        const artFile = 'data/hicksville-art.geojson'
        const spritesFile = 'data/sprites.geojson'

        const zoomThreshold = 14 // For clusters and markers
        let currentActiveCategory = 'all';
        let locationData;

        const map = new maplibregl.Map({
            container: "map",
            style: styleFile,
            center: [-73.52547, 40.76562],
            //maxBounds: bounds,
            zoom: zoomThreshold + 0.4,
            minZoom: 7,
            maxZoom: 18,
            bearing: 0,
            pitch: 20,
            hash: true,
            pixelRatio: 1
        });

        map.on('load', () => {

            fetch(locationFile)
                .then(res => res.json())
                .then(data => {
                    locationData = data;
                    // map.addSource('sprites', {
                    //     'type': 'vector',
                    //     tiles: ['http://localhost:8000/maptoons-tiles/{z}/{x}/{y}.pbf']
                    // });

                    // map.addLayer({
                    //     "id": "sprites",
                    //     "source": "sprites",
                    //     "source-layer": "maptoons-tiles",
                    //     "type": "symbol",
                    //     "layout": {
                    //         "icon-size": 0.4,
                    //         "symbol-placement": "point",
                    //         "icon-anchor": "bottom",
                    //         "icon-image": [
                    //             "concat",
                    //             "icon-",
                    //             ["get", "icon_number"]
                    //         ]
                    //     },
                    //     "paint": {
                    //         "icon-color": "hsl(0, 0%, 100%)",
                    //         "icon-opacity": [
                    //             "interpolate",
                    //             ["exponential", 0.5],
                    //             ["zoom"],
                    //             14, 0, 15, 1
                    //         ]
                    //     },
                    //     "minzoom": 16
                    // });

                    map.addSource('location', {
                        'type': 'geojson',
                        'data': locationData,
                        'cluster': true,
                        'clusterRadius': 20,
                        'clusterMinPoints': 3,
                        'clusterMaxZoom': zoomThreshold - 1
                    });

                    // Style for clustered circles
                    map.addLayer({
                        id: 'clusters',
                        type: 'circle',
                        source: 'location',
                        filter: ['has', 'point_count'],
                        paint: {
                            'circle-color': [
                                'step',
                                ['get', 'point_count'],
                                'hsl(270, 29%, 95%)',
                                10, 'hsl(270, 29%, 90%)',
                                25, 'hsl(270, 29%, 85%)'
                            ],
                            'circle-radius': [
                                'step',
                                ['get', 'point_count'],
                                15,
                                10, 20,
                                25, 25
                            ],
                            'circle-stroke-width': 1,
                            'circle-stroke-color': 'hsl(0, 0%, 30%)',
                        }
                    });

                    // Text label for cluster count
                    map.addLayer({
                        id: 'cluster-count',
                        type: 'symbol',
                        source: 'location',
                        filter: ['has', 'point_count'],
                        layout: {
                            'text-field': '{point_count_abbreviated}',
                            'text-font': ['poppins-regular'],
                            'text-size': 12
                        },
                        paint: {
                            'text-color': 'hsl(0, 0%, 0%)'
                        }
                    });

                    // Style for individual (non-clustered) points
                    map.addLayer({
                        id: 'cluster-points',
                        type: 'circle',
                        source: 'location',
                        filter: ['!', ['has', 'point_count']],
                        paint: {
                            'circle-radius': 7,
                            'circle-color': [
                                'case',
                                ['==', ['get', 'category'], 'eat_and_drink'], 'hsl(35, 100%, 70%)',
                                ['==', ['get', 'category'], 'visit_and_experience'], 'hsl(0, 79%, 75%)',
                                ['==', ['get', 'category'], 'play_and_learn'], 'hsl(296, 30%, 68%)',
                                ['==', ['get', 'category'], 'thrive_and_restore'], 'hsl(18, 55%, 63%)',
                                ['==', ['get', 'category'], 'shop_and_discover'], 'hsl(114, 35%, 61%)',
                                ['==', ['get', 'category'], 'live_and_work'], 'hsl(197, 35%, 66%)',
                                ['==', ['get', 'category'], 'gather_and_worship'], 'hsl(240, 12%, 54%)',
                                'hsl(0, 0%, 100%)' // default color if none match
                            ],
                            'circle-stroke-width': 1.5,
                            'circle-stroke-color': 'hsl(0, 0%, 30%)'
                        }
                    });

                    // Handle click on info button
                    document.getElementById('refresh-features-btn').addEventListener('click', () => {
                        // Optional: Add loading indicator
                        const btn = document.getElementById('refresh-features-btn');
                        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
                        btn.disabled = true;

                        // Call your function
                        updateInfoBox();

                        // Reset button after a short delay (optional)
                        setTimeout(() => {
                            btn.innerHTML = 'Show Info';
                            btn.disabled = false;
                        }, 1000);
                    });

                    // Handle clicks on cluster layer
                    map.on('click', (e) => {
                        // Check for any features at click location
                        const features = map.queryRenderedFeatures(e.point, {
                            layers: ['clusters', 'cluster-count', 'cluster-points']
                        });

                        if (features.length > 0) {
                            // If it's a cluster
                            if (features[0].properties?.cluster_id) {
                                // Simply fly to clicked position with slight zoom-in
                                map.easeTo({
                                    center: e.lngLat,
                                    zoom: zoomThreshold + 2,
                                    duration: 500,
                                    essential: true
                                });
                            }
                            // If it's a regular point feature
                            else {
                                // Show the feature info
                                clickFeature(features[0]);
                            }
                            return;
                        }
                    });

                    // Handle clicks on marker layer
                    document.addEventListener('click', (e) => {
                        // Check if clicking a marker image container
                        const clickedElement = e.target.closest('.custom-marker-img-container');
                        const parentMarker = clickedElement?.closest('.custom-marker');

                        // Check if clicking the info box or its children
                        const clickedInfoBox = e.target.closest('#info-box');

                        // Check if clicking anywhere EXCEPT markers
                        if (!parentMarker && !clickedInfoBox) {
                            // Remove active class from all markers
                            document.querySelectorAll('.custom-marker.active').forEach(el => {
                                el.classList.remove('active');
                            });
                            return;
                        }

                        // If clicking on info box, do nothing
                        if (clickedInfoBox) {
                            return;
                        }

                        // Toggle active state on clicked marker
                        parentMarker.classList.toggle('active');
                        setTimeout(() => parentMarker.classList.remove('active'), 1500);

                        // Handle feature data
                        const featureElement = clickedElement.closest('[data-feature]');
                        if (featureElement) {
                            try {
                                const feature = JSON.parse(featureElement.dataset.feature);
                                clickFeature(feature);
                            } catch (error) {
                                console.error("Couldn't parse feature data:", error);
                            }
                        }
                    });

                    // Handle clicks on category filter
                    document.addEventListener('click', (e) => {
                        const categoryFeatureElement = e.target.closest('.category-feature');
                        if (!categoryFeatureElement) return;

                        const category = categoryFeatureElement.dataset.category;
                        if (!category) return;

                        // Close any open popup when clicking a category
                        if (window.featurePopup) {
                            window.featurePopup.remove();
                            window.featurePopup = null;
                        }

                        // Remove all activeCategory classes first
                        document.querySelectorAll('.category-feature.activeCategory').forEach(el => {
                            el.classList.remove('activeCategory');
                        });

                        // Toggle logic
                        if (currentActiveCategory === category) {
                            // Second click on same category - remove filter
                            filterLocation('all'); // Show all features
                            categoryFeatureElement.classList.remove('activeCategory');
                            currentActiveCategory = 'all';
                        } else {
                            // New category selected
                            filterLocation(category);
                            categoryFeatureElement.classList.add('activeCategory');
                            currentActiveCategory = category;
                        }
                    });

                    // Close infobox on click
                    setupInfoBoxAutoClose();

                    // Show info button
                    map.once('idle', () => {
                        const btn = document.getElementById('refresh-features-btn');
                        btn.style.display = 'block';
                    });

                });
        });

        const filterLocation = (category) => {
            if (!locationData) return;

            const filtered = {
                ...locationData,
                features: category === 'all'
                    ? locationData.features
                    : locationData.features.filter(f => f.properties.category === category)
            };

            map.getSource('location').setData(filtered);

            currentActiveCategory = category;
            updateMarkers(); // now update markers as usual
        };

        const createCategoryBox = () => {

            const categoryBox = document.getElementById('category-box');
            categoryBox.innerHTML = '';
            const innerContainer = document.createElement('div');
            innerContainer.className = 'category-box-inner';
            categoryBox.appendChild(innerContainer);

            const dropdownWrapper = document.createElement('div');
            dropdownWrapper.className = 'category-dropdown-wrapper';

            // Dropdown button (the part you click)
            const dropdownButton = document.createElement('div');
            dropdownButton.className = 'dropdown-button';
            dropdownButton.textContent = 'Jump To...';

            // Dropdown menu (the collapsible part)
            const dropdownMenu = document.createElement('div');
            dropdownMenu.className = 'dropdown-menu';

            // Example locations
            const locations = [
                { id: 'loc1', name: 'Location 1' },
                { id: 'loc2', name: 'Location 2' },
                { id: 'loc3', name: 'Location 3' }
            ];

            // Add locations to the dropdown menu
            locations.forEach(location => {
                const option = document.createElement('div');
                option.className = 'dropdown-option';
                option.dataset.value = location.id;
                option.textContent = location.name;

                // Click event to select an option
                option.addEventListener('click', () => {
                    dropdownButton.textContent = location.name; // Update button text
                    dropdownMenu.classList.remove('open'); // Close menu
                    // you can trigger anything here, like flying to location
                });

                dropdownMenu.appendChild(option);
            });

            // Toggle menu open/close when clicking the button
            dropdownButton.addEventListener('click', () => {
                dropdownMenu.classList.toggle('open');
            });

            // Assemble the dropdown
            dropdownWrapper.appendChild(dropdownButton);
            dropdownWrapper.appendChild(dropdownMenu);

            // Insert into the container
            innerContainer.appendChild(dropdownWrapper);

            // Categories
            const categories = [
                { id: 'eat_and_drink', icon: 'fa-utensils' },
                { id: 'visit_and_experience', icon: 'fa-landmark' },
                { id: 'play_and_learn', icon: 'fa-child' },
                { id: 'thrive_and_restore', icon: 'fa-leaf' },
                { id: 'shop_and_discover', icon: 'fa-shopping-bag' },
                { id: 'live_and_work', icon: 'fa-home' },
                { id: 'gather_and_worship', icon: 'fa-church' }
            ];

            categories.forEach(({ id, icon }) => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-feature';
                categoryElement.dataset.category = id;
                const label = id
                    .replace(/_and_/g, ' & ')
                    .replace(/\b\w/g, char => char.toUpperCase());

                // Create icon element separately to apply color
                const iconElement = document.createElement('i');
                iconElement.className = `fa-solid ${icon}`;
                iconElement.style.color = getCategoryColor(id); // Apply category color

                // Create text span
                const textSpan = document.createElement('span');
                textSpan.textContent = label;

                // Append elements
                categoryElement.appendChild(iconElement);
                categoryElement.appendChild(textSpan);

                innerContainer.appendChild(categoryElement);
            });
        };

        // Create and update markers
        const markers = {};
        let markersOnScreen = {};

        function updateMarkers() {
            const zoom = map.getZoom();

            if (zoom <= zoomThreshold) {
                // Remove all markers if zoomed out
                for (const id in markersOnScreen) {
                    markersOnScreen[id].remove();
                }
                markersOnScreen = {};
                return;
            }

            // Determine which priorities should be displayed at this zoom level
            let priorityLevels = [];
            if (zoom >= zoomThreshold && zoom < zoomThreshold + 1) priorityLevels = ['Q'];
            if (zoom >= zoomThreshold + 1 && zoom < zoomThreshold + 1.5) priorityLevels = ['Q', 'T'];
            if (zoom >= zoomThreshold + 1.5 && zoom < zoomThreshold + 2) priorityLevels = ['Q', 'T', 'D'];
            if (zoom >= zoomThreshold + 2) priorityLevels = ['Q', 'T', 'D', 'S'];

            const newMarkers = {};
            const features = map.querySourceFeatures('location');

            for (let i = 0; i < features.length; i++) {
                const coords = features[i].geometry.coordinates;
                const props = features[i].properties;

                // Apply the category filter based on the global selectedCategory
                if (currentActiveCategory !== 'all' && props.category !== currentActiveCategory) continue;

                // Exclude clusters
                if (props.cluster || !priorityLevels.includes(props.priority)) continue;
                const id = props.id;

                let marker = markers[id];
                if (!marker) {
                    // Create container div
                    const el = document.createElement('div');
                    el.className = 'custom-marker';
                    el.dataset.id = id;
                    el.dataset.feature = JSON.stringify(features[i]);

                    // Create marker wrapper (holds circle + triangle)
                    const markerWrapper = document.createElement('div');
                    markerWrapper.className = 'custom-marker-wrapper';

                    // Create image container div (circle)
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'custom-marker-img-container';
                    imgContainer.style.border = `3px solid ${getCategoryColor(props.category)}`;

                    // Create image element
                    const img = document.createElement('img');
                    img.src = `${imgSource}/${props.img}.png`;
                    img.className = 'custom-marker-img';

                    // Create triangle element (now separate from the circle)
                    const triangle = document.createElement('div');
                    triangle.className = 'custom-marker-triangle';
                    triangle.style.borderTopColor = getCategoryColor(props.category); // Match border color

                    // Build the structure
                    imgContainer.appendChild(img);
                    markerWrapper.appendChild(triangle); // Triangle first (behind)
                    markerWrapper.appendChild(imgContainer); // Circle on top
                    el.appendChild(markerWrapper);

                    // Create label element
                    const label = document.createElement('p');
                    label.innerText = `${props.mapname}`;
                    label.className = 'custom-marker-label';
                    //label.style.color = getCategoryColor(props.category);

                    // Map priority to z-index values
                    const priorityMap = {
                        'Q': 400,
                        'T': 300,
                        'D': 200,
                        'S': 100
                    };

                    // Set z-index based on the priority
                    //el.style.zIndex = priorityMap[`${props.priority}`] || 0;

                    marker = markers[id] = new maplibregl.Marker({
                        element: el,
                        anchor: 'bottom',
                        offset: [-1, -5]
                    }).setLngLat(coords);
                }
                newMarkers[id] = marker;

                if (!markersOnScreen[id]) marker.addTo(map);
            }

            for (const id in markersOnScreen) {
                if (!newMarkers[id]) markersOnScreen[id].remove();
            }
            markersOnScreen = newMarkers;
        }

        const updateInfoBox = async () => {
            const features = map.querySourceFeatures('location');
            const infoBox = document.getElementById('info-box');
            let uniqueFeatures = new Map();

            infoBox.classList.add('visible');

            // Store the current content of the infoBox
            const currentContent = infoBox.innerHTML;

            const innerContainer = document.createElement('div');
            innerContainer.className = 'info-box-inner';

            // Process each feature
            for (const feature of features) {
                if (feature.properties.cluster_id) {
                    // Handle clustered features
                    const clusterId = feature.properties.cluster_id;

                    try {
                        // Get the individual features within the cluster
                        const clusterFeatures = await map.getSource('location').getClusterLeaves(
                            clusterId,
                            Infinity,
                            0
                        );
                        clusterFeatures.forEach(clusterFeature => {
                            const featureId = clusterFeature.properties.id;
                            if (!uniqueFeatures.has(featureId)) {
                                uniqueFeatures.set(featureId, clusterFeature);
                            }
                        });
                    } catch (error) {
                        console.error('Error fetching cluster leaves:', error);
                    }
                } else {
                    const featureId = feature.properties.id;
                    if (!uniqueFeatures.has(featureId)) {
                        uniqueFeatures.set(featureId, feature);
                    }
                }
            }

            // Convert the Map values to an array
            let allFeatures = Array.from(uniqueFeatures.values());

            // Sort features alphabetically by the 'mapname' property
            // allFeatures.sort((a, b) => {
            //     const nameA = a.properties.mapname || ''; // Changed from id to mapname for sorting
            //     const nameB = b.properties.mapname || '';
            //     return nameA.localeCompare(nameB);
            // });

            // Sort features by longitude (east to west)
            allFeatures.sort((a, b) => {
                const lonA = a.geometry.coordinates[0]; // Get longitude from first array element
                const lonB = b.geometry.coordinates[0];
                return lonA - lonB; // Sort from west (negative) to east (positive)
            });

            allFeatures.forEach(feature => {
                const properties = feature.properties;

                // Create feature container
                const featureElement = document.createElement('div');
                featureElement.className = 'info-feature';
                featureElement.dataset.id = properties.id;
                featureElement.dataset.feature = JSON.stringify(feature);

                // Create popup-like structure
                const popupContent = document.createElement('div');
                popupContent.className = 'info-popup-content';

                // Create header section
                const popupHeader = document.createElement('div');
                popupHeader.className = 'info-popup-header';
                //popupHeader.style.backgroundColor = getCategoryColor(properties.category); 

                // Create banner and logo
                if (properties.img) {
                    const banner = document.createElement('img');
                    banner.src = `${imgSource}/${properties.category}_banner.png`;
                    banner.className = 'info-popup-banner';
                    //popupHeader.appendChild(banner);

                    // Create color overlay
                    const overlay = document.createElement('div');
                    overlay.className = 'info-popup-banner-overlay';
                    overlay.style.backgroundColor = getCategoryColor(properties.category);
                    popupHeader.appendChild(overlay);

                    const img = document.createElement('img');
                    img.src = `${imgSource}/${properties.img}.png`;
                    img.className = 'info-popup-image';
                    popupHeader.appendChild(img);
                }

                // Create banner title
                // const title = document.createElement('h1');
                // title.className = 'info-popup-title';
                // title.textContent = properties.mapname;
                // popupHeader.appendChild(title);

                // Add header to content
                popupContent.appendChild(popupHeader);

                // Create text content container
                const textContainer = document.createElement('div');
                textContainer.className = 'info-popup-text';

                // Add info text if exists
                if (properties.info) {
                    const infoText = document.createElement('p');
                    infoText.className = 'truncated-text';
                    infoText.textContent = properties.info;

                    // Add click to expand functionality
                    infoText.addEventListener('click', (e) => {
                        e.currentTarget.classList.toggle('expanded');
                    });

                    textContainer.appendChild(infoText);
                }

                // Create contact info container
                const contactInfo = document.createElement('div');
                contactInfo.className = 'contact-info';

                // Add Address if exists
                if (properties.address) {
                    const addressDiv = document.createElement('div');
                    addressDiv.className = 'contact-item';
                    addressDiv.innerHTML = `
                        <i class="fa-solid fa-location-dot"></i>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(properties.address)}" 
                        target="_blank">${properties.address}</a>
                    `;
                    contactInfo.appendChild(addressDiv);
                }

                // Add Phone if exists
                if (properties.phone) {
                    const phoneDiv = document.createElement('div');
                    phoneDiv.className = 'contact-item';
                    phoneDiv.innerHTML = `
                        <i class="fa-solid fa-phone"></i>
                        <a href="tel:${properties.phone}">${properties.phone}</a>
                    `;
                    contactInfo.appendChild(phoneDiv);
                }

                // Add Email if exists
                if (properties.email) {
                    const emailDiv = document.createElement('div');
                    emailDiv.className = 'contact-item';
                    emailDiv.innerHTML = `
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:${properties.email}">${properties.email}</a>
                    `;
                    contactInfo.appendChild(emailDiv);
                }

                // Add Website if exists
                if (properties.web) {
                    const webDiv = document.createElement('div');
                    webDiv.className = 'contact-item';
                    webDiv.innerHTML = `
                        <i class="fa-solid fa-globe"></i>
                        <a href="${properties.web}" target="_blank">${properties.web.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(webDiv);
                }

                // Add Facebook if exists
                if (properties.facebook) {
                    const fbDiv = document.createElement('div');
                    fbDiv.className = 'contact-item';
                    fbDiv.innerHTML = `
                        <i class="fa-brands fa-facebook"></i>
                        <a href="${properties.facebook}" target="_blank">${properties.facebook.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(fbDiv);
                }

                // Add Instagram if exists
                if (properties.instagram) {
                    const igDiv = document.createElement('div');
                    igDiv.className = 'contact-item';
                    igDiv.innerHTML = `
                        <i class="fa-brands fa-instagram"></i>
                        <a href="${properties.instagram}" target="_blank">${properties.instagram.replace(/^https?:\/\//, '')}</a>
                    `;
                    contactInfo.appendChild(igDiv);
                }

                // Only add contact info if at least one exists
                if (contactInfo.children.length > 0) {
                    textContainer.appendChild(contactInfo);
                }

                // Add the complete text container to popup content
                popupContent.appendChild(textContainer);

                // Create footer container
                const footer = document.createElement('div');
                footer.className = 'info-popup-footer';

                // Add Address if exists
                if (properties.address) {
                    const addressColumn = document.createElement('div');
                    addressColumn.className = 'info-footer-column info-footer-address';

                    const searchQuery = encodeURIComponent(`${properties.mapname} ${properties.address}`);
                    addressColumn.innerHTML = `
                        <a href="https://www.google.com/maps/search/?api=1&query=${searchQuery}" target="_blank"><i class="fa-solid fa-location-dot"></i></a>
                    `;
                    footer.appendChild(addressColumn);
                }

                // Add Phone if exists
                if (properties.phone) {
                    const phoneColumn = document.createElement('div');
                    phoneColumn.className = 'info-footer-column info-footer-phone';
                    phoneColumn.innerHTML = `
                        <a href="tel:${properties.phone}"><i class="fa-solid fa-phone"></i></a>
                    `;
                    footer.appendChild(phoneColumn);
                }

                // Add Email if exists
                if (properties.email) {
                    const emailColumn = document.createElement('div');
                    emailColumn.className = 'info-footer-column info-footer-email';
                    emailColumn.innerHTML = `
                        <a href="mailto:${properties.email}"><i class="fa-solid fa-envelope"></i></a>
                    `;
                    footer.appendChild(emailColumn);
                }

                // Add Website if exists
                if (properties.web) {
                    const webColumn = document.createElement('div');
                    webColumn.className = 'info-footer-column info-footer-web';
                    webColumn.innerHTML = `
                        <a href="${properties.web}" target="_blank"><i class="fa-solid fa-globe"></i></a>
                    `;
                    footer.appendChild(webColumn);
                }

                // Add Facebook if exists
                if (properties.facebook) {
                    const facebookColumn = document.createElement('div');
                    facebookColumn.className = 'info-footer-column info-footer-facebook';
                    facebookColumn.innerHTML = `
                        <a href="${properties.facebook}" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                    `;
                    footer.appendChild(facebookColumn);
                }

                // Add Instagram if exists
                if (properties.instagram) {
                    const instagramColumn = document.createElement('div');
                    instagramColumn.className = 'info-footer-column info-footer-instagram';
                    instagramColumn.innerHTML = `
                        <a href="${properties.instagram}" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    `;
                    footer.appendChild(instagramColumn);
                }

                // Only add footer if at least one contact method exists
                // if (footer.children.length > 0) {
                //     popupContent.appendChild(footer);
                // }

                // Add the complete popup content to the feature element
                featureElement.appendChild(popupContent);
                innerContainer.appendChild(featureElement);
            });

            // Update DOM
            infoBox.innerHTML = '';
            infoBox.appendChild(innerContainer);
            if (innerContainer.children.length === 0 && currentContent) {
                infoBox.innerHTML = currentContent;
            }

            // Get center feature
            setupFeatureTracking();
        };

        // Close infobox on map click
        let clickOutsideHandler;

        function setupInfoBoxAutoClose() {
            // Remove previous handler if exists
            if (clickOutsideHandler) {
                document.removeEventListener('click', clickOutsideHandler);
            }

            clickOutsideHandler = (e) => {
                const infoBox = document.getElementById('info-box');
                if (!infoBox?.classList.contains('visible')) return;

                const protected = [
                    '.mapboxgl-marker',
                    '.custom-marker',
                    '#refresh-features-btn',
                    '#info-box',
                    '.maplibregl-popup' // Add if using popups
                ].join(',');

                if (!e.target.closest(protected)) {
                    infoBox.classList.remove('visible');
                }
            };

            document.addEventListener('click', clickOutsideHandler);
        }

        // Helper function to handle clicks
        const clickFeature = (feature) => {
            let coordinates = feature.geometry.coordinates;

            try {
                // Fly to location
                flyToFeature(coordinates);

                // Update infobox
                updateInfoBox();

                // Scroll to feature in infobox
                scrollToFeatureInfo(feature);
            } catch (error) {
                console.error('Error handling feature click:', error);
            }
        };

        // Helper function to fly to feature
        const flyToFeature = (coordinates) => {
            return new Promise((resolve) => {

                map.easeTo({
                    center: coordinates,
                    zoom: zoomThreshold + 3,
                    offset: [0, -80],
                    essential: true
                });

                map.once('moveend', resolve);
            });
        };

        // Helper function to scroll to feature info
        const scrollToFeatureInfo = (feature) => {
            const featureId = feature.properties.id;
            const infoFeature = document.querySelector(`.info-feature[data-id="${featureId}"]`);

            if (infoFeature) {
                // Scroll into view
                requestAnimationFrame(() => {
                    infoFeature.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',  // Better for horizontal scrolling
                        inline: 'center'
                    });
                });

                // Activate infobox feature
                if (infoFeature) {
                    infoFeature.classList.add('active');
                    setTimeout(() => infoFeature.classList.remove('active'), 1500);
                }
            }
        };

        // Helper function to get center infobox feature
        function handleCenterFeature() {
            const container = document.querySelector('.info-box-inner');
            if (!container) return;

            // Calculate center position
            const centerX = container.scrollLeft + (container.offsetWidth / 2);

            // Find centered feature
            const features = document.querySelectorAll('.info-feature');
            for (const feature of features) {
                const featureStart = feature.offsetLeft;
                const featureEnd = featureStart + feature.offsetWidth;

                if (featureStart <= centerX && featureEnd >= centerX) {
                    const featureData = JSON.parse(feature.dataset.feature);

                    flyToFeature(featureData.geometry.coordinates).then(() => {

                        // Find and activate the corresponding map marker
                        const markerId = featureData.properties.id;
                        const markerElement = document.querySelector(`.custom-marker[data-id="${markerId}"]`);
                        if (markerElement) {
                            markerElement.classList.add('active');
                            setTimeout(() => markerElement.classList.remove('active'), 1500);
                        }

                        // Find and activate infobox feature
                        const infoFeature = document.querySelector(`.info-feature[data-id="${markerId}"]`);
                        if (infoFeature) {
                            infoFeature.classList.add('active');
                            setTimeout(() => infoFeature.classList.remove('active'), 1500);

                        }

                    });
                    return featureData.properties.id;
                }
            }
        }

        // Helper function scroll listener
        let isUserScrolling = false;

        function setupFeatureTracking() {
            const container = document.querySelector('.info-box-inner');
            if (!container) return;

            // Detect ALL user scroll initiations (mouse, trackpad, touch, wheel)
            container.addEventListener('mousedown', () => isUserScrolling = true);
            container.addEventListener('touchstart', () => isUserScrolling = true);
            container.addEventListener('wheel', () => isUserScrolling = true, { passive: true });

            // Add keyboard scroll detection (NEW)
            document.addEventListener('keydown', (e) => {
                const scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                    'PageUp', 'PageDown', 'Home', 'End'];
                if (scrollKeys.includes(e.key)) {
                    isUserScrolling = true;
                }
            });

            // Handle scroll events
            container.addEventListener('scroll', () => {
                if (!isUserScrolling) return; // Ignore programmatic scrolls

                clearTimeout(window.scrollTimer);
                window.scrollTimer = setTimeout(() => {
                    handleCenterFeature(); // Your existing center-feature function
                    isUserScrolling = false; // Reset after scroll ends
                }, 150); // 150ms delay after scrolling stops
            });
        }

        // Helper function to get category color
        // original category colors
        // 'eat_and_drink': 'hsl(35, 100%, 40%)',
        // 'visit_and_experience': 'hsl(0, 79%, 45%)',
        // 'play_and_learn': 'hsl(296, 30%, 38%)',
        // 'thrive_and_restore': 'hsl(18, 55%, 33%)',
        // 'shop_and_discover': 'hsl(114, 35%, 31%)',
        // 'live_and_work': 'hsl(197, 35%, 36%)',
        // 'gather_and_worship': 'hsl(240, 12%, 24%)'
        const getCategoryColor = (category) => {
            const colorMap = {
                'eat_and_drink': 'hsl(35, 100%, 70%)',
                'visit_and_experience': 'hsl(0, 79%, 75%)',
                'play_and_learn': 'hsl(296, 30%, 68%)',
                'thrive_and_restore': 'hsl(18, 55%, 63%)',
                'shop_and_discover': 'hsl(114, 35%, 61%)',
                'live_and_work': 'hsl(197, 35%, 66%)',
                'gather_and_worship': 'hsl(240, 12%, 54%)',
                'default': 'hsl(0, 0%, 100%)'
            };
            return colorMap[category] || colorMap.default;
        };

        // Update markers on the screen and do so on every map move/moveend
        map.on('data', (e) => {
            if (e.sourceId !== 'location' || !e.isSourceLoaded) return;

            map.on('move', updateMarkers);
            map.on('moveend', updateMarkers);
            updateMarkers();
        });

        map.once('idle', () => {
            createCategoryBox();
        });

        // Update infobox in real time
        // map.on('data', (e) => {
        //     if (e.sourceId === 'location' && e.isSourceLoaded) {
        //         updateInfoBox();
        //     }
        // });

        // Log clicks
        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point);
            if (features.length > 0) {
                console.log('Clicked feature:', features[0].properties);
            } else {
                console.log('No features at this location');
            }
        });

    </script>
