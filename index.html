<!DOCTYPE html>
<html lang="en">

<head>
    <title>MapToons</title>
    <meta property="og:description" content="maptoons.com" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { color: hsl(0, 0%, 20%); height: 100vh; width: 100vw; }
        .container { position:relative; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }

        .maplibregl-ctrl-bottom-right{ display: none; }
        .maplibregl-canvas-container { text-rendering: optimizeLegibility; }

        #location-picker { position: fixed; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 999; font-size: 35px; text-align:right; display: block; width: auto; height: auto; cursor: pointer; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 1)); }
        nav {display:none; flex-direction:column; align-items:flex-start; width:100%; background-color:#333; position:absolute; right:0; top:50px;}
        nav.show {display:flex;}
        nav a {color:white; text-decoration:none; font-size:14px; line-height:0.8; padding-bottom:10px; margin:10px;}

        #category-box { display: flex; position: fixed; top: 10px; left: 0; right: 0; overflow-x: auto; overflow-y: visible; z-index: 1000; max-width: 90vw; height: auto; margin: 0 auto; scrollbar-width: none; -ms-overflow-style: none; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); border-radius: 5px; }
        .category-box-inner { display: flex; justify-content: flex-start; gap: 10px; margin: 0 auto; background-color: hsla(0, 0%, 100%, 1); padding: 10px; border-radius: 5px; }
        .category-feature { position: relative; flex-shrink: 0; width: 40px; height: 40px; overflow: visible; cursor: pointer; }
        .category-feature .image-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center; z-index: 2; }
        .category-feature .image-container img { width: 40px; height: 40px; border-radius: 5px; }
        .category-text { position: absolute; bottom: -10%; left: 50%; transform: translate(-50%, 50%); font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 8px; line-height: 0.8; color: hsl(0, 0%, 20%); letter-spacing: 1px; text-align: center; width: fit-content; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; display: inline-block; z-index: 1; }

        .category-feature.active { filter: drop-shadow(0px 0px 2px hsla(60, 100%, 50%, 0.1)); }
        .category-feature.active img { width: 55px; height: 55px; }

        #info-box { display: flex; position: fixed; bottom: 10px; left: 0; right: 0; overflow-x: auto; overflow-y: visible; z-index: 1000; max-width: 90vw; height: auto; margin: 0 auto; scrollbar-width: none; -ms-overflow-style: none; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); border-radius: 5px; }
        .info-box-inner { display: flex; gap: 10px; margin: 0 auto; background-color: hsla(0, 0%, 100%, 1); padding: 10px; border-radius: 5px; }
        .info-feature { position: relative; width: auto; height: auto; overflow: visible; cursor: pointer; }
        .info-feature .info-image-container { text-align: center; line-height: 0; }
        .info-feature .info-image { width: auto; height: 30px; cursor: pointer; }

        .marker { left: 0; top: 0; pointer-events: auto; cursor: pointer; background-color: transparent !important; filter: drop-shadow(2px 2px 2px hsla(0, 0%, 0%, 0.2)); will-change: transform; }
        .marker-image { display: block; pointer-events: auto; max-width: 30px; max-height: 30px; }
        .marker-circle { display: none; pointer-events: auto; }

        .maplibregl-popup { width: auto; height: auto; z-index: 900 !important; }
        .maplibregl-popup-content { padding: 0; width: 100%; height: 100%; box-shadow: 2px 2px 2px hsla(0, 0%, 20%, 0.2); }
        .popup-content { position: relative; padding:10px; overflow-y:auto; overflow-x:hidden; width: 100%; height: 100%; }
        .popup-image { width: 100%; height: 100%; }
        .popup-logo { position: relative; width: 100%; height: 100%;}
        .popup-logo img { position: absolute; top: 50%; left: 50%; transform: translate( -50% -50%); width: 50%; height: auto; }
        .popup-category { position:relative; width:100%; text-align:center; }
        .popup-category img { width:250px; height:auto; }
        .popup-title { max-width:100%; overflow:hidden; }
        .popup-title h3 { margin:0 0 4px 0; font-size:14px; color:#666; white-space:normal; word-wrap:break-word; }
        .popup-title h2 { margin:0; font-size:18px; white-space:normal; word-break:break-word; max-width:100%; }
        .popup-body { font-size:14px; line-height:1.4; max-width:100%; overflow-wrap:break-word; }
        .popup-body p { margin:8px 0; overflow-wrap:break-word; max-width:100%; }
        .popup-body a { word-break:break-all; max-width:100%; display:inline-block; }
        
        a { color: hsl(200, 50%, 40%); text-decoration: none; }
        h1 { font-size: 15px; font-weight: 600; line-height: 1.1; margin-bottom: 2px; }
        h2 { font-size: 13px; font-weight: 600; line-height: 1.1; margin-bottom: 2px; }
        h3 { font-size: 9px; font-weight: 400; line-height: 1.1; margin-bottom: 2px; }
        h4 { color: hsl(0, 0%, 100%); font-size: 8px; font-weight: 900; letter-spacing: 0; line-height: 1; }
        p { font-size: 12px; font-weight: 400; letter-spacing: 0; line-height: 1.4; }
        p.ellipsis { max-width: calc(100vw - 100px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (min-width: 768px) {
            p.ellipsis { max-width: 180px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="location-picker"></div>
        <nav>
        </nav>
        <div id="map"></div>
        <div id="info-box"></div>
        <div id="category-box"></div>
    </div>

    <script>

        // Location picker
        document.querySelector('#location-picker').addEventListener('click', function () {
            document.querySelector('nav').classList.toggle('show');
        });

        function closeMenu() {
            document.querySelector('nav').classList.remove('show');
        }

        //const bounds = [[-73.5519, 40.7374], [-73.4932, 40.7935]]; // Hicksville
        const bounds = [[-74.04196910000002, 40.5419011], [-71.85627049999998, 41.161155]]; // Long Island

        let locationData;
        let loadedImages = new Set();
        let currentActiveCategory = null;
        let markerContainers = new Set();

        //const imgSource = 'http://localhost:8000/img'
        const imgSource = 'https://maptoons.github.io/img'
        //const styleFile = 'http://localhost:8000/maptoons.json'
        const styleFile = 'https://maptoons.github.io/maptoons.json'
        //const locationFile = 'http://localhost:8000/data/hicksville.geojson'
        const locationFile = 'https://maptoons.github.io/data/hicksville.geojson'
        //const artFile = 'http://localhost:8000/data/hicksville-art.geojson'
        const artFile = 'https://maptoons.github.io/data/hicksville-art.geojson'

        const map = new maplibregl.Map({
            container: "map",
            style: styleFile,
            center: [-73.5251, 40.7684],
            maxBounds: bounds,
            zoom: 14,
            maxZoom: 18,
            bearing: 20,
            pitch: 20,
            //maxPitch: 20,
            //minPitch: 20,
            //dragRotate: false,
            hash: true,
            pixelRatio: 1
        });

        //map.setBearing(20);
        map.getCanvas().addEventListener('contextmenu', (e) => e.stopPropagation(), true);

        const loadLocation = async () => {
            const response = await fetch(locationFile);
            locationData = await response.json();

            // Set maxBounds to extent
            //const bounds = getGeoJSONExtent(locationData);            
            //map.setMaxBounds(bounds);
            // Set center to centroid
            const centroid = getGeoJSONCentroid(locationData);
            map.setCenter(centroid);

            map.addSource('location', {
                'type': 'geojson',
                'data': locationData,
                'cluster': false
            });

            // Temp layer to start
            map.addLayer({
                id: 'location-temp',
                type: 'circle', // Use a simple layer type
                source: 'location',
                paint: {
                    'circle-radius': 0, // Make the layer invisible
                    'circle-opacity': 0 // Make the layer invisible
                }
            });

            // Load images
            const loadingImages = new Set();

            map.on('styleimagemissing', (e) => {
                const imageId = e.img;

                // Check if the image is already loaded or being loaded
                if (!loadedImages.has(imageId) && !loadingImages.has(imageId)) {
                    loadingImages.add(imageId); // Mark the image as being loaded

                    const imageUrl = `${imgSource}/${imageId}.png`;

                    fetch(imageUrl)
                        .then(response => response.blob())
                        .then(blob => createImageBitmap(blob))
                        .then(imageBitmap => {
                            map.addImage(imageId, imageBitmap);
                            loadedImages.add(imageId); // Mark the image as loaded
                            loadingImages.delete(imageId); // Remove from loading set
                            console.log(`Loaded missing image: ${imageId}`);
                        })
                        .catch(error => {
                            console.error(`Failed to load image ${imageId}:`, error);
                            loadingImages.delete(imageId); // Remove from loading set on error
                        });
                }

            });

            // Click for category filter
            document.addEventListener('click', (e) => {
                const categoryFeatureElement = e.target.closest('.category-feature');
                if (!categoryFeatureElement) return;
                
                const category = categoryFeatureElement.dataset.category;
                if (!category) return;

                // Toggle logic
                if (currentActiveCategory === category) {
                    // Second click on same category - remove filter
                    filterLocation('all'); // Show all features
                    categoryFeatureElement.classList.remove('active');
                    currentActiveCategory = null;
                } else {
                    // New category selected
                    filterLocation(category);
                    document.querySelectorAll('.category-feature.active').forEach(el => {
                        el.classList.remove('active');
                    });
                    categoryFeatureElement.classList.add('active');
                    currentActiveCategory = category;
                }
            });

            // Click for markers, info-box
            document.addEventListener('click', (e) => {
                // 1. Detect clicks on either:
                const clickedElement = e.target.closest(
                    '.marker-image, .info-feature'
                );
                if (!clickedElement) return;

                // 2. Get the nearest parent with feature data (works for both cases)
                const featureElement = clickedElement.closest('[data-feature]');
                if (!featureElement) return;

                // 3. Parse and pass the feature
                try {
                    const feature = JSON.parse(featureElement.dataset.feature);
                    clickFeature(feature);

                    // Add active class
                    document.querySelectorAll('.marker-image.active').forEach(el => {
                        el.classList.remove('active');
                    });
                    featureElement.classList.add('active');

                } catch (error) {
                    console.error("Couldn't parse feature data:", error);
                }
            });

            map.once('idle', () => {
                createCategoryBox();
                updateInfoBox();
            });

        };

        const loadArt = async () => {
            const response = await fetch(artFile);
            artData = await response.json();

            const iconNames = [...new Set(
                artData.features
                    .filter(f => f.properties?.img) // Only features with img property
                    .map(f => f.properties.img)
            )];

            await Promise.all(iconNames.map(async iconName => {
                const imageUrl = `${imgSource}/${iconName}.png`;
                await loadImage(imageUrl, iconName);
            }));

            map.addSource('art', {
                'type': 'geojson',
                'data': artData,
                'cluster': false
            });

            map.addLayer({
                id: 'art',
                type: 'symbol',
                source: 'art',
                minzoom: 12,
                layout: {
                    'icon-image': ['get', 'img'],
                    'icon-size': 0.3,
                    'icon-allow-overlap': true
                }
            },'location-temp');
        };
        
        const updateMarkerSize = (markerElement, currentZoom) => {
            // Remove markers when zoomed too far out
            if (currentZoom <= 10) {
                markerElement.style.display = 'none';
                return;
            }
            
            // Show marker if it was previously hidden
            markerElement.style.display = 'block';

            // Safely get the image element
            const img = markerElement.querySelector('.marker-image') || 
                        markerElement.querySelector('img'); // Fallback
            
            if (!img) {
                console.warn('Marker image not found in:', markerElement);
                return;
            }

            // Calculate size - example using logarithmic scaling
            const sizeSteps = {
                14: 30,
                15: 50,
                16: 70,
                17: 90,
                18: 110
            };

            const getClosestZoom = (current) => 
                Object.keys(sizeSteps).reduce((prev, curr) => 
                    Math.abs(curr - current) < Math.abs(prev - current) ? curr : prev
                );

            const size = sizeSteps[getClosestZoom(currentZoom)] || 30;
            
            // Apply styles directly to the image
            img.style.maxWidth = `${size}px`;
            img.style.maxHeight = `${size}px`;
            img.style.transformOrigin = 'center bottom'; // Better anchor point
        };

        let lastZoom = map.getZoom();
        map.on('zoomend', () => {
            const currentZoom = map.getZoom();
            if (Math.abs(currentZoom - lastZoom) > 0.3) {
                // Update ALL markers - both existing and new
                markerContainers.forEach(container => {
                    updateMarkerSize(container, currentZoom);
                });
                lastZoom = currentZoom;
            }
        });

        // 4. Cleanup when markers are removed
        function removeMarker(id) {
            if (markersOnScreen[id]) {
                const container = markersOnScreen[id].getElement();
                markerContainers.delete(container);
                markersOnScreen[id].remove();
                delete markersOnScreen[id];
            }
        }

        const createMarker = (feature) => {
            const id = feature.properties.id;
            const imageUrl = `${imgSource}/${feature.properties.img}.png`;
            const category = feature.properties.category;
            const priority = priorityLevel(feature.properties.priority);

            // Create container element
            const el = document.createElement('div');
            el.className = 'marker';
            el.style.zIndex = 10 + priority;
            el.dataset.category = category;
            el.dataset.id = id;

            const img = document.createElement('img');
            img.className = 'marker-image';
            img.src = imageUrl;
            img.dataset.id = id;
            img.dataset.feature = JSON.stringify(feature);
            el.appendChild(img);

            markerContainers.add(el);
            updateMarkerSize(el, map.getZoom());

            return el;
        }

        let markers = {};
        let markersOnScreen = {};

        const updateInfoBox = async () => {
            const source = 'location';
            const features = map.querySourceFeatures(source);
            let uniqueFeatures = new Map();
            const newMarkers = {};

            // Create inner container
            const infoBox = document.getElementById('info-box');
            // Store the current content of the infoBox
            const currentContent = infoBox.innerHTML;
            // Clear the infoBox only after new content is ready
            let newContent = '';

            const innerContainer = document.createElement('div');
            innerContainer.className = 'info-box-inner';

            // Process each feature
            for (const feature of features) {
                const coordinates = feature.geometry.coordinates;
                const id = feature.properties.id;

                if (!uniqueFeatures.has(id)) {
                    let marker = markers[id];
                    if (!marker) {
                        const el = await createMarker(feature);
                        marker = markers[id] = new maplibregl.Marker({
                            element: el
                        }).setLngLat(coordinates);

                        // Initial size update
                        updateMarkerSize(el, map.getZoom());

                    }
                    newMarkers[id] = marker;

                    // Add the marker to the map if it's not already there
                    if (!markersOnScreen[id]) {
                        marker.addTo(map);
                    }

                    uniqueFeatures.set(id, feature);

                }

            }
            // Remove markers that are no longer on the screen
            for (const id in markersOnScreen) {
                if (!newMarkers[id]) markersOnScreen[id].remove();
            }
            markersOnScreen = newMarkers;

            // Convert the Map values to an array
            let allFeatures = Array.from(uniqueFeatures.values());

            // Sort features alphabetically by the 'mapname' property
            allFeatures.sort((a, b) => {
                const nameA = a.properties.id || ''; // Handle undefined values
                const nameB = b.properties.id || ''; // Handle undefined values
                return nameA.localeCompare(nameB); // Sort alphabetically
            });

            allFeatures.forEach(feature => {
                const id = feature.properties.id;
                const image = feature.properties.img;
                const imageUrl = `${imgSource}/${image}.png`;

                const featureElement = document.createElement('div');
                featureElement.className = 'info-feature';
                featureElement.dataset.id = id;
                featureElement.dataset.feature = JSON.stringify(feature);

                const imageContainer = document.createElement('div');
                imageContainer.className = 'info-image-container';

                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'info-image';

                imageContainer.appendChild(img);
                featureElement.appendChild(imageContainer);
                innerContainer.appendChild(featureElement);
            });

            // Update DOM
            infoBox.innerHTML = '';
            infoBox.appendChild(innerContainer);
            if (innerContainer.children.length === 0 && currentContent) {
                infoBox.innerHTML = currentContent;
            }
        };

        const createCategoryBox = async () => {
            const categoryBox = document.getElementById('category-box');
            
            // Clear existing content and create inner container
            categoryBox.innerHTML = '';
            const innerContainer = document.createElement('div');
            innerContainer.className = 'category-box-inner';
            categoryBox.appendChild(innerContainer);

            const categories = [
                'eat_and_drink',
                'visit_and_experience',
                'play_and_learn', 
                'thrive_and_restore',
                'shop_and_discover',
                'live_and_work',
                'gather_and_worship'
            ];

            categories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-feature';
                categoryElement.dataset.category = category;

                const imgContainer = document.createElement('div');
                imgContainer.className = 'image-container';

                const img = document.createElement('img');
                img.src = `${imgSource}/${category}.png`;
                img.className = 'category-image';

                const textElement = document.createElement('div');
                textElement.className = 'category-text';
                textElement.textContent = category.split('_')[0].toUpperCase();

                imgContainer.appendChild(img);
                categoryElement.appendChild(imgContainer);
                categoryElement.appendChild(textElement);
                innerContainer.appendChild(categoryElement);
            });
        };

        const filterLocation = async (category) => {
            // 1. Filter features
            const filteredFeatures = locationData.features.filter(
                feature => category === 'all' || feature.properties.category === category
            );

            // 2. Update source data
            if (map.getSource('location')) {
                map.getSource('location').setData({
                    type: 'FeatureCollection',
                    features: filteredFeatures
                });
                
                // 5. Ensure map renders changes
                map.on('data', (e) => {
                    if (e.sourceId === 'location' && e.isSourceLoaded) {
                        updateInfoBox();
                    }
                });
            }
        };

        function updateSprites() {
            const addresses = map.querySourceFeatures('osm', {
                sourceLayer: 'addresses'
            });

            const pois = map.querySourceFeatures('osm', {
                 sourceLayer: 'pois'
            });

            // const features = [...addresses, ...pois];
            const features = pois;
            const totalIcons = 60; //trees (1-24), flowers (25-43), people (44-60)

            const osm_icons = {
                type: "FeatureCollection",
                features: features.map((feature) => ({
                    type: "Feature",
                    geometry: feature.geometry,
                    properties: {
                        icon_number: Math.round(Math.abs(feature.geometry.coordinates[0] * 100000)) % totalIcons + 1,
                    }
                }))
            };

            if (map.getSource('osm-icons')) {
                map.getSource('osm-icons').setData(osm_icons);
            } else {
                map.addSource('osm-icons', {
                    type: 'geojson',
                    data: osm_icons
                });

                map.addLayer({
                    "source": "osm-icons",
                    "id": "osm-icons",
                    "type": "symbol",
                    "layout": {
                        "symbol-placement": "point",
                        "icon-keep-upright": true,
                        "icon-allow-overlap": false,
                        "icon-ignore-placement": true,
                        "icon-anchor": "bottom",
                        "icon-size": [
                            "case",
                            [">=", ["get", "icon_number"], 44], 0.2,
                            [">=", ["get", "icon_number"], 25], 0.2,
                            0.3
                        ],
                        "icon-image": [
                            "concat",
                            "icon-",
                            ["get", "icon_number"]
                        ]
                    },
                    "paint": {
                        "icon-color": "hsl(0, 0%, 100%)",
                        "text-color": "hsl(0, 0%, 100%)",
                        "icon-opacity": 0.5
                    },
                    minzoom: 14
                }, 'temp-location');

            }
        }

        // Click feature with popup support
        const clickFeature = async (feature) => {
            if (!feature?.geometry?.coordinates) return;

            const coordinates = feature.geometry.coordinates;

            try {
                // Show popup and get reference
                const popup = showFeaturePopup(feature, coordinates);

                // Fly to location with popup-aware padding
                await flyToFeature(coordinates, popup);

                //await updateInfoBox();
                //scrollToFeatureInfo(feature.properties.id);

            } catch (error) {
                console.error('Error handling feature click:', error);
            }
        };

        // Helper function to create MapLibre popup with feature data
        const showFeaturePopup = (feature, coordinates) => {
            if (window.featurePopup) {
                window.featurePopup.remove();
            }

            const { properties } = feature;
            const imageLogo = `${imgSource}/${properties.img || 'default'}.png`;
            const imageCategory = `${imgSource}/${properties.category || 'default'}.png`;

            // Calculate sizes based on window dimensions
            const isMobile = window.innerWidth < 768;
            const maxWidth = isMobile ? window.innerWidth * 0.9 : 400;
            const maxHeight = isMobile ? window.innerHeight * 0.5 : 500;

            const popupContent = document.createElement('div');
            popupContent.className = 'popup-content';
            popupContent.style.maxHeight = `${maxHeight}px`;
            popupContent.style.overflowY = 'auto';

            // Clear existing content (optional, if needed)
            popupContent.textContent = ''; // or popupContent.replaceChildren();

            // Create the outer div with class 'popup-image'
            const popupImageDiv = document.createElement('div');
            popupImageDiv.className = 'popup-image';

            // Create the inner div with class 'popup-category'
            const popupCategoryDiv = document.createElement('div');
            popupCategoryDiv.className = 'popup-category';

            // Create the img element
            const img = document.createElement('img');
            img.src = imageCategory;

            // Assemble the structure
            popupCategoryDiv.appendChild(img);
            popupImageDiv.appendChild(popupCategoryDiv);
            popupContent.appendChild(popupImageDiv);

            const popup = new maplibregl.Popup({
                closeButton: false,
                closeOnClick: true,
                anchor: 'bottom',
                offset: 20,
                maxWidth: `${maxWidth}px`
            })
                .setLngLat(coordinates)
                .setDOMContent(popupContent)
                .addTo(map);

            // Handle window resize
            const resizeHandler = () => {
                const newMaxWidth = window.innerWidth < 768 ? window.innerWidth * 0.9 : 400;
                popup.options.maxWidth = `${newMaxWidth}px`;
                popupContent.style.maxHeight = `${window.innerHeight * 0.5}px`;
            };

            window.addEventListener('resize', resizeHandler);

            // Cleanup on popup close
            popup.on('close', () => {
                window.removeEventListener('resize', resizeHandler);
            });

            window.featurePopup = popup;
            return popup;
        };

        // Helper function for flyTo animation
        const flyToFeature = (coordinates) => {
            return new Promise((resolve) => {

                map.easeTo({
                    center: coordinates,
                    zoom: 17,
                    padding: { top: 300, bottom: 100, left: 20, right: 20 },
                    essential: true
                });

                map.once('moveend', resolve);
            });
        };

        // Helper function to scroll to feature info
        const scrollToFeatureInfo = (featureId) => {
            const infoBox = document.querySelector(`.info-feature[data-id="${featureId}"]`);
            if (infoBox) {
                // Small timeout ensures DOM update is complete
                setTimeout(() => {
                    infoBox.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start',
                        inline: 'start'
                    });

                    // Add highlight effect
                    infoBox.classList.add('highlight');
                    //setTimeout(() => infoBox.classList.remove('highlight'), 2000); // timed highlight
                }, 100);
            }
        };

        // Helper function to get color based on category
        const categoryColors = (category) => {
            const colorMap = {
                'eat_and_drink': 'hsl(35, 100%, 50%)',
                'visit_and_experience': 'hsl(0, 79%, 55%)',
                'play_and_learn': 'hsl(296, 30%, 48%)',
                'thrive_and_restore': 'hsl(18, 55%, 43%)',
                'shop_and_discover': 'hsl(114, 35%, 41%)',
                'live_and_work': 'hsl(197, 35%, 46%)',
                'gather_and_worship': 'hsl(240, 12%, 34%)',
                'default': 'hsl(0, 0%, 80%)'
            };
            return colorMap[category] || colorMap.default;
        };

        // Helper function to get level based on priority
        const priorityLevel = (priority) => {
            const levelMap = {
                'S': 1,
                'D': 2,
                'T': 3,
                'Q': 4,
                'default': 0
            };
            return levelMap[priority] || levelMap.default;
        };

        const loadImage = async (url, name) => {
            try {
                const iconData = await map.loadImage(url);
                map.addImage(name, iconData.data);
            } catch (error) {
                console.error(`Failed to load image for ${name}:`, error);
            }
        };

        const updateLabels = () => {
            const isVisible = map.getZoom() >= 18;
            document.querySelectorAll('.marker-label').forEach(el => {
                el.classList.toggle('visible', isVisible);
            });
        };

        // Helper function to calculate GeoJSON extent
        function getGeoJSONExtent(geojson) {
            const bounds = new maplibregl.LngLatBounds();
            
            geojson.features.forEach(feature => {
                if (feature.geometry.type === 'Point') {
                    bounds.extend(feature.geometry.coordinates);
                } else if (feature.geometry.type === 'Polygon') {
                    feature.geometry.coordinates[0].forEach(coord => {
                        bounds.extend(coord);
                    });
                }
                // Add other geometry types as needed
            });
            
            return bounds;
        }

        // Helper function to calculate centroid of GeoJSON
        function getGeoJSONCentroid(geojson) {
            let x = 0;
            let y = 0;
            let pointCount = 0;

            // Process each feature in the GeoJSON
            geojson.features.forEach(feature => {
                const coords = getCoordinates(feature.geometry);
                coords.forEach(coord => {
                    if (Array.isArray(coord[0])) {
                        // Handle polygons/multilinestrings
                        coord.forEach(subCoord => {
                            x += subCoord[0];
                            y += subCoord[1];
                            pointCount++;
                        });
                    } else {
                        // Handle points/linestrings
                        x += coord[0];
                        y += coord[1];
                        pointCount++;
                    }
                });
            });

            return [x / pointCount, y / pointCount];
        }

        // Helper function to extract coordinates from any geometry type
        function getCoordinates(geometry) {
            switch (geometry.type) {
                case 'Point':
                    return [geometry.coordinates];
                case 'LineString':
                case 'MultiPoint':
                    return geometry.coordinates;
                case 'Polygon':
                case 'MultiLineString':
                    return geometry.coordinates.flat();
                case 'MultiPolygon':
                    return geometry.coordinates.flat(2);
                case 'GeometryCollection':
                    return geometry.geometries.flatMap(getCoordinates);
                default:
                    return [];
            }
        }

        map.once('load', (e) => {
            loadLocation();
            loadArt();
        });

        map.on('moveend', () => {
            updateInfoBox();
        });

        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point);
            if (features.length > 0) {
                console.log('Clicked feature:', features[0].properties);
            } else {
                console.log('No features at this location');
            }
        });

    </script>
